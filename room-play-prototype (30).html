<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комната — прототип механики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --wall-deep: #2c2116;
    --wall-mid: #4a3a26;
    --wall-light: #6b5236;
    --gold: #ff8234;
    --gold-soft: #ffcf9e;
    --glow: #a3bf6f;
    --cream: #fae6d8;
    --ink: #201a13;
    --danger: #e2574c;
    --panel-a: #3d2f1e;
    --panel-b: #271f15;
    --panel-c: #1c160f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--adaptive-bg, var(--ink));
    font-family:'Nunito Sans', sans-serif;
    color:var(--cream);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    position:relative;
  }

  /* ---------- Прогресс ---------- */
  #progress-bar{
    position:absolute;
    top:14px; left:14px; right:224px;
    display:flex; align-items:center; gap:14px;
    z-index:300;
  }
  #progress-track{
    flex:1;
    height:22px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,0.25);
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.25), inset 0 1px 2px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
  }
  #progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(180deg, rgba(255,255,255,0.5), var(--glow) 40%, var(--gold));
    border-radius:999px;
    box-shadow:inset 0 1px 2px rgba(255,255,255,0.5);
    transition:width 0.6s cubic-bezier(.4,1.4,.6,1);
  }
  #progress-pct{
    font-weight:800;
    font-size:20px;
    color:var(--gold-soft);
    min-width:52px;
    text-align:right;
    text-shadow:0 1px 0 rgba(255,255,255,0.35), 0 2px 2px rgba(0,0,0,0.35), 0 4px 6px rgba(0,0,0,0.25);
  }
  #sound-toggle{
    flex:0 0 auto;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(14px) saturate(180%);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:50%;
    width:40px; height:40px;
    font-size:16px;
    cursor:pointer;
    color:var(--gold-soft);
    box-shadow:0 4px 14px rgba(0,0,0,0.25), inset 0 1px 2px rgba(255,255,255,0.35);
  }
  #sound-toggle:hover{ background:rgba(255,255,255,0.2); }

  /* ---------- Стартовый экран выбора локации ---------- */
  #location-screen{
    position:fixed; inset:0;
    z-index:600;
    background:radial-gradient(circle at 50% 30%, #3d2f1e, #1c160f 75%);
    display:none; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow-y:auto;
    gap:22px;
    padding:48px 24px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,130,52,0.5) transparent;
  }
  #location-screen.visible{ display:flex; }
  #location-screen::-webkit-scrollbar{ width:7px; }
  #location-screen::-webkit-scrollbar-track{ background:transparent; }
  #location-screen::-webkit-scrollbar-thumb{
    background:rgba(255,130,52,0.45);
    border-radius:4px;
  }
  #location-screen::-webkit-scrollbar-thumb:hover{ background:rgba(255,130,52,0.7); }
  #location-screen-title{
    font-family:'Cormorant Garamond', serif;
    font-size:48px; font-weight:700;
    color:#ffcf9e;
    text-align:center;
    letter-spacing:0.3px;
  }
  #location-screen-title.neon-glow{
    text-shadow:0 0 12px currentColor, 0 0 26px currentColor, 0 0 46px currentColor;
  }
  #location-screen-sub{
    margin-top:-18px;
    font-size:16px;
    color:#c6b8a6;
    text-align:center;
  }
  #location-grid{
    display:flex; flex-wrap:wrap;
    justify-content:center;
    gap:26px;
    max-width:1100px;
  }
  .location-card{
    width:260px; height:190px;
    border-radius:16px;
    background-size:cover;
    background-position:center;
    border:1px solid rgba(255,255,255,0.18);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .location-card:hover{
    transform:translateY(-4px) scale(1.02);
    border-color:rgba(255,130,52,0.6);
    box-shadow:0 10px 26px rgba(0,0,0,0.45);
  }
  .location-card::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(10,7,16,0.55) 100%);
  }
  .location-card-label{
    position:absolute;
    left:10px; bottom:8px;
    z-index:1;
    font-size:13px; font-weight:700;
    color:var(--cream);
    text-shadow:0 1px 3px rgba(0,0,0,0.7);
  }

  /* ---------- Комната ---------- */
  #room{
    flex:1 1 auto;
    position:relative;
    display:flex;
    overflow:hidden;
  }
  #room-visual{
    flex:1 1 auto;
    position:relative;
    display:flex;
    background-color:var(--wall-deep);
    background-size:contain;
    background-position:center top;
    background-repeat:no-repeat;
    overflow:hidden;
  }
  .wall-seg{
    flex:1;
    position:relative;
  }

  /* ---------- Список категорий (справа, сплошная колонка) ---------- */
  #category-list{
    position:relative;
    z-index:300;
    flex:0 0 210px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.4), transparent 10%),
      linear-gradient(0deg, rgba(255,255,255,0.15), transparent 12%),
      linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-left:1px solid rgba(255,255,255,0.28);
    box-shadow:inset 1px 0 0 rgba(255,255,255,0.15), -8px 0 24px rgba(0,0,0,0.2);
    padding:16px 12px;
    display:flex; flex-direction:column; gap:8px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,130,52,0.5) transparent;
  }
  #category-list::-webkit-scrollbar{ width:7px; }
  #category-list::-webkit-scrollbar-track{ background:transparent; }
  #category-list::-webkit-scrollbar-thumb{
    background:rgba(255,130,52,0.45);
    border-radius:4px;
  }
  #category-list::-webkit-scrollbar-thumb:hover{ background:rgba(255,130,52,0.7); }
  #category-list-title{
    font-family:'Cormorant Garamond', serif;
    font-size:17px; font-weight:600;
    color:var(--gold-soft);
    margin:0 4px 6px;
    letter-spacing:0.3px;
  }
  .lock-slot{
    display:flex; align-items:center; gap:12px;
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .lock-slot.active:hover{ background:rgba(255,130,52,0.1); }
  .lock-slot.solved:hover{ background:rgba(163,191,111,0.1); }
  .lock-slot.viewing{ background:rgba(163,191,111,0.16); }
  .lock-icon{
    flex:0 0 auto;
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #5a4066, #241a35 75%);
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow:0 0 0 rgba(255,130,52,0);
    transition:box-shadow .3s ease, transform .2s ease;
  }
  .lock-slot.active .lock-icon{
    animation:pulse-glow 2.2s ease-in-out infinite;
    cursor:pointer;
  }
  .lock-slot.solved .lock-icon{
    background:radial-gradient(circle at 35% 30%, #3d6b5c, #1c3a30 75%);
    border-color:var(--glow);
    box-shadow:0 0 18px rgba(163,191,111,0.55);
  }
  .lock-slot.disabled .lock-icon{
    opacity:0.45;
    cursor:default;
  }
  @keyframes pulse-glow{
    0%,100%{ box-shadow:0 0 10px rgba(255,130,52,0.55); transform:scale(1); }
    50%{ box-shadow:0 0 26px rgba(255,130,52,0.95); transform:scale(1.06); }
  }
  .lock-label{
    flex:1 1 auto;
    font-size:13.5px;
    font-weight:600;
    text-align:left;
    color:var(--gold-soft);
    line-height:1.25;
  }
  .lock-slot.disabled .lock-label{ opacity:0.55; }

  .placed-item{
    position:absolute;
    touch-action:none;
  }
  .item-visual{
    position:absolute;
    inset:0;
    display:flex; align-items:center; justify-content:center;
    transform-origin:center center;
    cursor:grab;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.45));
  }
  .item-visual:active{ cursor:grabbing; }
  .placed-item.selected .item-visual{
    outline:2px dashed var(--glow);
    outline-offset:6px;
    border-radius:8px;
  }
  .placed-item .glyph{
    font-size:40px;
    line-height:1;
    pointer-events:none;
  }
  .placed-item img{
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
  }

  /* Якорь: увеличение + свободный поворот одним движением */
  .item-handle{
    position:absolute;
    right:-9px; bottom:-9px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--glow);
    border:2px solid var(--ink);
    box-shadow:0 0 6px rgba(163,191,111,0.7);
    display:none;
    cursor:grab;
    z-index:2;
  }
  .item-handle:active{ cursor:grabbing; }
  .placed-item.selected .item-handle{ display:block; }

  /* Кнопка убрать предмет — не наследует поворот/масштаб */
  .item-delete{
    position:absolute;
    top:-11px; left:-11px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--danger);
    color:var(--ink);
    border:none;
    font-size:14px; font-weight:700; line-height:1;
    display:none;
    align-items:center; justify-content:center;
    cursor:pointer;
    z-index:3;
  }
  .placed-item.selected .item-delete{ display:flex; }

  /* Кнопки отражения — тоже не наследуют поворот/масштаб */
  .item-flip{
    position:absolute;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--wall-light);
    color:var(--gold-soft);
    border:2px solid var(--ink);
    font-size:12px; font-weight:700; line-height:1;
    display:none;
    align-items:center; justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .item-flip:hover{ background:var(--gold); color:var(--ink); }
  .placed-item.selected .item-flip{ display:flex; }
  .item-flip-h{ top:-10px; right:-10px; }
  .item-flip-v{ bottom:-10px; left:-10px; }

  /* ---------- Инвентарь ---------- */
  #tray{
    position:relative;
    z-index:300;
    flex:0 0 auto;
    max-height:190px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.4), transparent 15%),
      linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-top:1px solid rgba(255,255,255,0.28);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 -8px 24px rgba(0,0,0,0.2);
    display:flex; flex-direction:column;
    gap:2px;
    padding:10px 18px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,130,52,0.5) transparent;
  }
  #tray::-webkit-scrollbar{ width:7px; }
  #tray::-webkit-scrollbar-track{ background:transparent; }
  #tray::-webkit-scrollbar-thumb{
    background:rgba(255,130,52,0.45);
    border-radius:4px;
  }
  #tray::-webkit-scrollbar-thumb:hover{ background:rgba(255,130,52,0.7); }
  #tray .empty-note{
    color:rgba(243,234,217,0.45);
    font-style:italic;
    font-size:14px;
    padding:8px 0;
  }
  .tray-group{
    display:flex; align-items:center; gap:14px;
    padding:8px 0;
  }
  .tray-group + .tray-group{
    border-top:1px solid rgba(255,130,52,0.12);
  }
  .tray-group-label{
    flex:0 0 92px;
    font-size:12.5px;
    font-weight:700;
    color:var(--gold-soft);
    letter-spacing:0.2px;
    line-height:1.2;
  }
  .tray-group-items{
    flex:1;
    display:flex; align-items:center;
    gap:12px;
    overflow-x:auto;
    padding:2px 0;
  }
  .tray-item{
    flex:0 0 auto;
    width:64px; height:64px;
    border-radius:10px;
    background:rgba(255,130,52,0.08);
    border:1px solid rgba(255,130,52,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    cursor:grab;
    transition:transform .15s ease;
  }
  .tray-item:hover{ transform:translateY(-3px); }
  .tray-item.dragging{ opacity:0.3; }
  .tray-item img{
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
  }

  /* ---------- Модалка задания ---------- */
  #task-overlay{
    position:fixed; inset:0;
    background:rgba(10,7,16,0.72);
    display:none; align-items:center; justify-content:center;
    z-index:400;
  }
  #task-overlay.visible{ display:flex; }

  /* ---------- Экран поздравления при 100% ---------- */
  #completion-screen{
    position:fixed; inset:0;
    background:rgba(10,7,16,0.82);
    display:none; align-items:center; justify-content:center;
    z-index:700;
    padding:24px;
  }
  #completion-screen.visible{ display:flex; }
  #confetti-layer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:710;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px; height:14px;
    opacity:0.95;
    animation-name:confetti-fall;
    animation-timing-function:cubic-bezier(.4,.2,.6,1);
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(112vh) rotate(420deg); opacity:0.25; }
  }
  .completion-card{
    position:relative;
    background:rgba(61,47,30,0.5);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:20px;
    padding:32px 34px;
    width:min(400px, 90vw);
    max-height:88vh;
    overflow-y:auto;
    text-align:center;
    box-shadow:0 0 22px rgba(255,130,52,0.4), 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation:completion-pop 0.5s cubic-bezier(.34,1.56,.64,1), completion-neon-pulse 2.4s ease-in-out infinite 0.5s;
  }
  @keyframes completion-pop{
    0%{ transform:scale(0.7); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes completion-neon-pulse{
    0%,100%{ box-shadow:0 0 22px rgba(255,130,52,0.55), 0 0 50px rgba(255,130,52,0.3), 0 24px 60px rgba(0,0,0,0.55); }
    50%{ box-shadow:0 0 34px rgba(255,130,52,0.85), 0 0 76px rgba(255,130,52,0.5), 0 24px 60px rgba(0,0,0,0.55); }
  }
  .completion-star{
    font-size:38px;
    letter-spacing:6px;
    margin-bottom:6px;
    color:var(--gold);
  }
  .completion-star span{
    display:inline-block;
    text-shadow:0 0 14px rgba(255,130,52,0.85), 0 0 28px rgba(255,130,52,0.5);
    animation:star-pop 0.45s ease-out backwards;
  }
  .completion-star span:nth-child(1){ animation-delay:0.15s; }
  .completion-star span:nth-child(2){ animation-delay:0.32s; }
  .completion-star span:nth-child(3){ animation-delay:0.49s; }
  @keyframes star-pop{
    0%{ transform:scale(0) rotate(-35deg); opacity:0; }
    70%{ transform:scale(1.25) rotate(8deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .completion-title{
    font-family:'Cormorant Garamond', serif;
    font-size:28px; font-weight:700;
    color:var(--gold-soft);
    margin-bottom:8px;
    text-shadow:0 0 18px rgba(255,130,52,0.35);
  }
  .completion-sub{
    font-size:14px;
    color:rgba(243,234,217,0.85);
    margin-bottom:18px;
    line-height:1.4;
  }
  .completion-image{
    width:100%; max-width:260px;
    border-radius:14px;
    margin:0 auto 20px;
    display:block;
    box-shadow:0 10px 26px rgba(0,0,0,0.4);
  }
  .completion-btn{
    background:linear-gradient(180deg, var(--gold), #e6691c);
    color:var(--ink);
    border:none;
    padding:12px 30px;
    border-radius:12px;
    font-size:15px; font-weight:700;
    cursor:pointer;
    box-shadow:0 0 14px rgba(255,130,52,0.5);
    transition:transform .15s ease;
  }
  .completion-btn:hover{ transform:translateY(-2px); }
  #task-card{
    background:rgba(47,36,23,0.55);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:16px;
    padding:28px 30px;
    width:min(420px, 92vw);
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 0 24px rgba(255,130,52,0.25), 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
    scrollbar-width:thin;
    scrollbar-color:rgba(255,130,52,0.5) transparent;
  }
  #task-card::-webkit-scrollbar{ width:7px; }
  #task-card::-webkit-scrollbar-track{ background:transparent; }
  #task-card::-webkit-scrollbar-thumb{
    background:rgba(255,130,52,0.45);
    border-radius:4px;
  }
  #task-card::-webkit-scrollbar-thumb:hover{ background:rgba(255,130,52,0.7); }
  #task-card h3{
    font-family:'Cormorant Garamond', serif;
    font-size:26px;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  #task-card p{
    font-size:15px;
    color:#f3ead9;
    margin:0 0 18px;
    line-height:1.4;
  }
  #task-card .katex{ color:inherit; font-size:1.05em; }
  #task-card .katex-display{ margin:8px 0; }
  #task-question-image{
    display:block;
    width:100%; max-height:180px;
    object-fit:contain;
    border-radius:12px;
    margin:0 0 14px;
    background:rgba(0,0,0,0.15);
  }
  .task-opt-image{
    display:block;
    width:100%; max-height:120px;
    object-fit:contain;
    border-radius:8px;
    margin-bottom:6px;
  }
  .task-options{ display:flex; flex-direction:column; gap:10px; }
  .task-opt{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,130,52,0.4);
    color:#f3ead9;
    padding:11px 14px;
    border-radius:10px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .task-opt:hover{ background:rgba(255,255,255,0.1); box-shadow:0 0 12px rgba(255,130,52,0.4); }
  .task-opt.correct{ background:rgba(163,191,111,0.22); border-color:var(--glow); }
  .task-opt.selected{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,130,52,0.35) inset; }
  .task-opt.wrong{ background:rgba(226,87,76,0.22); border-color:var(--danger); }

  /* Верно / неверно */
  .tf-row{ display:flex; gap:12px; }
  .tf-btn{
    flex:1;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,130,52,0.4);
    color:#f3ead9;
    padding:14px; border-radius:10px;
    font-size:15px; font-weight:700;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }

  function setLocation(url){
    room.style.backgroundImage = `url('${url}')`;
    applyRoomColorTint(url);
  }

  // ---------- Подстройка фона под цвет комнаты ----------
  function applyRoomColorTint(url){
    try {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const size = 16;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < data.length; i += 4){
            r += data[i]; g += data[i + 1]; b += data[i + 2];
            count++;
          }
          r = Math.round(r / count);
          g = Math.round(g / count);
          b = Math.round(b / count);

          // Затемняем усреднённый цвет комнаты, чтобы получить тёмную подложку с тем же оттенком
          const darkR = Math.round(r * 0.16);
          const darkG = Math.round(g * 0.16);
          const darkB = Math.round(b * 0.16);
          const deepR = Math.round(r * 0.08);
          const deepG = Math.round(g * 0.08);
          const deepB = Math.round(b * 0.08);

          document.documentElement.style.setProperty('--ink', `rgb(${darkR},${darkG},${darkB})`);
          document.documentElement.style.setProperty('--wall-deep', `rgb(${deepR},${deepG},${deepB})`);
        } catch (e) { /* картинка с другого домена без CORS — оставляем цвет по умолчанию */ }
      };
      img.src = url;
    } catch (e) { /* игнорируем — используем цвет по умолчанию */ }

  const SOUND_STYLES = {
    soft: {
      correctType:'sine', correct:[523.25, 659.25, 783.99],
      wrongType:'sawtooth', wrong:196,
      completionType:'triangle', completion:[523.25, 659.25, 783.99, 1046.5]
    },
    bright: {
      correctType:'triangle', correct:[659.25, 880, 1046.5],
      wrongType:'square', wrong:220,
      completionType:'square', completion:[659.25, 880, 1046.5, 1318.5]
    },
    retro: {
      correctType:'square', correct:[440, 554.37, 659.25],
      wrongType:'square', wrong:150,
      completionType:'square', completion:[440, 554.37, 659.25, 880]
    }
  };
  const SOUND_STYLE = SOUND_STYLES['soft'] || SOUND_STYLES.soft;
  const SOUND_VOLUME = 0.15;

  let soundEnabled = true;
  let audioCtx = null;

  const soundToggleBtn = document.getElementById('sound-toggle');
  soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
  soundToggleBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  function getAudioCtx(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type, delay, volume){
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const startTime = ctx.currentTime + (delay || 0);
      const vol = volume == null ? SOUND_VOLUME : volume;
      gain.gain.setValueAtTime(vol, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.03);
    } catch (e) { /* звук недоступен — просто пропускаем */ }
  }

  function playCorrectSound(){
    SOUND_STYLE.correct.forEach((f, i) => playTone(f, 0.12 + i * 0.05, SOUND_STYLE.correctType, i * 0.1, SOUND_VOLUME));
  }
  function playWrongSound(){
    playTone(SOUND_STYLE.wrong, 0.28, SOUND_STYLE.wrongType, 0, SOUND_VOLUME * 0.7);
  }
  function playCompletionSound(){
    SOUND_STYLE.completion.forEach((f, i) => playTone(f, 0.28, SOUND_STYLE.completionType, i * 0.13, SOUND_VOLUME));
  }

  // ---- Тип: тест с вариантами ----
  function renderQuizTask(task){
    const wrap = document.createElement('div');
    wrap.className = 'task-options';
    const options = task.options || [];

    if (task.multiSelect){
      const selected = new Set();
      options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'task-opt';
        const imgHtml = opt.img ? `<img class="task-opt-image" src="${opt.img}" alt="">` : '';
        btn.innerHTML = `${imgHtml}<span>${opt.text || ''}</span>`;
        btn.addEventListener('click', () => {
          if (selected.has(i)){ selected.delete(i); btn.classList.remove('selected'); }
          else { selected.add(i); btn.classList.add('selected'); }
        });
        wrap.appendChild(btn);
      });
      const checkBtn = document.createElement('button');
      checkBtn.className = 'input-check-btn';
      checkBtn.style.marginTop = '14px';
      checkBtn.style.width = '100%';
      checkBtn.textContent = CHECK_BUTTON_TEXT;
      const buttons = () => wrap.querySelectorAll('.task-opt');
      checkBtn.addEventListener('click', () => {
        const correctSet = new Set(options.map((o, i) => o.correct ? i : null).filter(i => i !== null));
        const isCorrect = selected.size === correctSet.size && [...selected].every(i => correctSet.has(i));
        if (isCorrect){
          buttons().forEach((btn, i) => { if (correctSet.has(i)) btn.classList.add('correct'); });
          completeTask();
        } else {
          playWrongSound();
          buttons().forEach((btn, i) => {
            if (selected.has(i) && !correctSet.has(i)) btn.classList.add('wrong');
          });
          setTimeout(() => { buttons().forEach(btn => btn.classList.remove('wrong')); }, 600);
        }
      });
      wrap.appendChild(checkBtn);
    } else {
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'task-opt';
        const imgHtml = opt.img ? `<img class="task-opt-image" src="${opt.img}" alt="">` : '';
        btn.innerHTML = `${imgHtml}<span>${opt.text || ''}</span>`;
        btn.addEventListener('click', () => {
          if (opt.correct){
            btn.classList.add('correct');
            completeTask();
          } else {
            btn.classList.add('wrong');
            playWrongSound();
            setTimeout(() => btn.classList.remove('wrong'), 600);
          }
        });
        wrap.appendChild(btn);
      });
    }

  // ---- Тип: соединение пар ----
  function renderMatchTask(task){
    const pairs = task.pairs || [];
    const rightShuffled = pairs.map((p, i) => ({text:p.right, pairIndex:i}));
    for (let i = rightShuffled.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [rightShuffled[i], rightShuffled[j]] = [rightShuffled[j], rightShuffled[i]];
    }

    const wrap = document.createElement('div');
    wrap.className = 'match-columns';
    const leftCol = document.createElement('div');
    leftCol.className = 'match-col';
    const rightCol = document.createElement('div');
    rightCol.className = 'match-col';

    let selectedLeft = null;
    let selectedRight = null;
    let matchedCount = 0;

    pairs.forEach((p, i) => {
      const pill = document.createElement('button');
      pill.className = 'match-pill';
      pill.textContent = p.left;
      pill.dataset.pairIndex = i;
      pill.addEventListener('click', () => {
        if (pill.classList.contains('matched')) return;
        leftCol.querySelectorAll('.match-pill').forEach(el => el.classList.remove('selected'));
        pill.classList.add('selected');
        selectedLeft = pill;
        tryMatch();
      });
      leftCol.appendChild(pill);
    });

    rightShuffled.forEach(r => {
      const pill = document.createElement('button');
      pill.className = 'match-pill';
      pill.textContent = r.text;
      pill.dataset.pairIndex = r.pairIndex;
      pill.addEventListener('click', () => {
        if (pill.classList.contains('matched')) return;
        rightCol.querySelectorAll('.match-pill').forEach(el => el.classList.remove('selected'));
        pill.classList.add('selected');
        selectedRight = pill;
        tryMatch();
      });
      rightCol.appendChild(pill);
    });

    function tryMatch(){
      if (!selectedLeft || !selectedRight) return;
      if (selectedLeft.dataset.pairIndex === selectedRight.dataset.pairIndex){
        selectedLeft.classList.add('matched');
        selectedRight.classList.add('matched');
        selectedLeft.classList.remove('selected');
        selectedRight.classList.remove('selected');
        matchedCount++;
        selectedLeft = null; selectedRight = null;
        if (matchedCount === pairs.length) completeTask();
      } else {
        selectedLeft.classList.add('wrong-flash');
        selectedRight.classList.add('wrong-flash');
        playWrongSound();
        setTimeout(() => {
          selectedLeft.classList.remove('selected', 'wrong-flash');
          selectedRight.classList.remove('selected', 'wrong-flash');
          selectedLeft = null; selectedRight = null;
        }, 500);
      }
    }

    wrap.appendChild(leftCol);
    wrap.appendChild(rightCol);
    taskBody.appendChild(wrap);
  }

    wrap.appendChild(feedback);

  // ---- Тип: собери предложение ----
  function renderSentenceTask(task){
    const words = task.words || [];
    const shuffled = words.map((w, i) => ({text: w, idx: i}));
    for (let i = shuffled.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const wrap = document.createElement('div');
    const assembledRow = document.createElement('div');
    assembledRow.className = 'sentence-assembled';
    const chipsRow = document.createElement('div');
    chipsRow.className = 'sentence-chips';

    let nextIndex = 0;

    function renderAssembled(){
      if (nextIndex === 0){
        assembledRow.innerHTML = '<span class="sentence-placeholder">…</span>';
      } else {
        assembledRow.innerHTML = words.slice(0, nextIndex)
          .map(w => `<span class="sentence-word">${w}</span>`).join(' ');
      }
      renderMathIn(document.getElementById('task-card'));
    }
    renderAssembled();

    shuffled.forEach(item => {
      const chip = document.createElement('button');
      chip.className = 'sentence-chip';
      chip.textContent = item.text;
      chip.addEventListener('click', () => {
        if (chip.disabled) return;
        if (item.idx === nextIndex){
          chip.disabled = true;
          chip.classList.add('used');
          nextIndex++;
          renderAssembled();
          if (nextIndex === words.length) completeTask();
        } else {
          playWrongSound();
          chip.classList.add('shake');
          setTimeout(() => chip.classList.remove('shake'), 400);
        }
      });
      chipsRow.appendChild(chip);
    });

    wrap.appendChild(assembledRow);
    wrap.appendChild(chipsRow);
    taskBody.appendChild(wrap);
  }

  // ---------- Черновик (рисование в задании) ----------
  const draftToggle = document.getElementById('draft-toggle');
  const draftPanel = document.getElementById('draft-panel');
  const draftCanvas = document.getElementById('draft-canvas');
  const draftClear = document.getElementById('draft-clear');
  const draftCtx = draftCanvas.getContext('2d');
  let draftDrawing = false;
  let draftSized = false;

  function sizeDraftCanvas(){
    const rect = draftCanvas.getBoundingClientRect();
    draftCanvas.width = rect.width;
    draftCanvas.height = rect.height;
    draftCtx.lineWidth = 2.5;
    draftCtx.lineCap = 'round';
    draftCtx.strokeStyle = '#2c2116';
  }

  function clearDraft(){
    draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
  }

  function resetDraft(){
    draftPanel.classList.remove('visible');
    draftToggle.classList.remove('active');
    if (draftSized) clearDraft();
  }

  draftToggle.addEventListener('click', () => {
    const willShow = !draftPanel.classList.contains('visible');
    draftPanel.classList.toggle('visible', willShow);
    draftToggle.classList.toggle('active', willShow);
    if (willShow && !draftSized){
      sizeDraftCanvas();
      draftSized = true;
    }
  });

  draftClear.addEventListener('click', clearDraft);

  function draftPos(e){
    const rect = draftCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  draftCanvas.addEventListener('pointerdown', (e) => {
    draftDrawing = true;
    const p = draftPos(e);
    draftCtx.beginPath();
    draftCtx.moveTo(p.x, p.y);
    draftCanvas.setPointerCapture(e.pointerId);
  });
  draftCanvas.addEventListener('pointermove', (e) => {
    if (!draftDrawing) return;
    const p = draftPos(e);
    draftCtx.lineTo(p.x, p.y);
    draftCtx.stroke();
  });
  draftCanvas.addEventListener('pointerup', () => { draftDrawing = false; });
  draftCanvas.addEventListener('pointercancel', () => { draftDrawing = false; });

    tray.appendChild(group);
    const groupItems = group.querySelector('.tray-group-items');

    cat.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'tray-item';
      if (item.img){
        el.innerHTML = `<img src="${item.img}" alt="">`;
      } else {
        el.textContent = item.glyph;
      }
      el.draggable = true;
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', JSON.stringify({
          glyph: item.glyph || null,
          img: item.img || null,
          baseSize: item.baseSize || null,
          catId: cat.id
        }));
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      groupItems.appendChild(el);
    });

  // ---------- Drag & drop предметов в комнату ----------
  room.addEventListener('dragover', (e) => e.preventDefault());
  room.addEventListener('drop', (e) => {
    e.preventDefault();
    const raw = e.dataTransfer.getData('text/plain');
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (err) { data = { glyph: raw }; }
    const rect = room.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    placeItem(data, x, y);
  });

  function placeItem(data, x, y){
    const baseSize = data.baseSize || 64;
    const el = document.createElement('div');
    el.className = 'placed-item';
    el.style.width = baseSize + 'px';
    el.style.height = baseSize + 'px';
    el.style.left = (x - baseSize / 2) + 'px';
    el.style.top = (y - baseSize / 2) + 'px';
    el.dataset.cx = x;
    el.dataset.cy = y;
    el.dataset.scale = 1;
    el.dataset.rot = 0;
    el.dataset.flipx = 1;
    el.dataset.flipy = 1;
    el.dataset.base = baseSize;

    const visualInner = data.img
      ? `<img src="${data.img}" alt="">`
      : `<div class="glyph">${data.glyph}</div>`;

    el.innerHTML = `
      <button class="item-delete" title="Убрать">×</button>
      <button class="item-flip item-flip-h" title="Отразить по горизонтали">⇋</button>
      <button class="item-flip item-flip-v" title="Отразить по вертикали">⇵</button>
      <div class="item-visual">
        ${visualInner}
        <div class="item-handle" title="Тяни: увеличить и повернуть"></div>
      </div>
    `;
    room.appendChild(el);
    setupItemInteractions(el);
    selectItem(el);

    // Категория даёт балл за размещение только один раз —
    // повторные предметы из той же категории уже ничего не добавляют
    if (data.catId){
      const cat = categories.find(c => c.id === data.catId);
      if (cat && !cat.placed){
        cat.placed = true;
      }
    }
    updateProgress();
  }

  function applyTransform(el){
    const visual = el.querySelector('.item-visual');
    const scale = el.dataset.scale;
    const flipX = el.dataset.flipx;
    const flipY = el.dataset.flipy;
    visual.style.transform = `rotate(${el.dataset.rot}deg) scale(${scale * flipX}, ${scale * flipY})`;
  }

  function setupItemInteractions(el){
    const visual = el.querySelector('.item-visual');
    const handle = el.querySelector('.item-handle');
    const delBtn = el.querySelector('.item-delete');
    const flipHBtn = el.querySelector('.item-flip-h');
    const flipVBtn = el.querySelector('.item-flip-v');

    flipHBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      el.dataset.flipx = parseFloat(el.dataset.flipx) * -1;
      applyTransform(el);
    });
    flipVBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      el.dataset.flipy = parseFloat(el.dataset.flipy) * -1;
      applyTransform(el);
    });

    // ---- Перемещение (тянем тело предмета) ----
    let moving = false, startPX = 0, startPY = 0, startCX = 0, startCY = 0;

    visual.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selectItem(el);
      moving = true;
      visual.setPointerCapture(e.pointerId);
      startPX = e.clientX; startPY = e.clientY;
      startCX = parseFloat(el.dataset.cx);
      startCY = parseFloat(el.dataset.cy);
    });
    visual.addEventListener('pointermove', (e) => {
      if (!moving) return;
      const dx = e.clientX - startPX;
      const dy = e.clientY - startPY;
      const nx = startCX + dx, ny = startCY + dy;
      el.dataset.cx = nx; el.dataset.cy = ny;
      const base = parseFloat(el.dataset.base);
      el.style.left = (nx - base / 2) + 'px';
      el.style.top = (ny - base / 2) + 'px';
    });
    visual.addEventListener('pointerup', () => moving = false);
    visual.addEventListener('pointercancel', () => moving = false);

    // ---- Якорь: тянем — растёт и вращается вокруг центра предмета ----
    let handling = false;
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selectItem(el);
      handling = true;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
      if (!handling) return;
      const roomRect = room.getBoundingClientRect();
      const cx = parseFloat(el.dataset.cx);
      const cy = parseFloat(el.dataset.cy);
      const px = e.clientX - roomRect.left;
      const py = e.clientY - roomRect.top;
      const dx = px - cx, dy = py - cy;

      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      const rot = angle - 45; // якорь стоит в углу под 45°, это нулевая точка поворота

      const dist = Math.sqrt(dx * dx + dy * dy);
      const base = parseFloat(el.dataset.base);
      const baseDist = (base / 2) * Math.SQRT2;
      let scale = dist / baseDist;
      scale = Math.max(0.35, Math.min(4, scale));

      el.dataset.rot = rot;
      el.dataset.scale = scale;
      applyTransform(el);
    });
    handle.addEventListener('pointerup', () => handling = false);
    handle.addEventListener('pointercancel', () => handling = false);

    // ---- Удаление ----
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      el.remove();
      if (selectedItem === el) selectedItem = null;
      updateProgress();
    });
  }

  function selectItem(el){
    if (selectedItem) selectedItem.classList.remove('selected');
    selectedItem = el;
    el.classList.add('selected');
    zCounter++;
    el.style.zIndex = zCounter;
  }

  room.addEventListener('pointerdown', (e) => {
    if (e.target === room || e.target.classList.contains('wall-seg')){
      if (selectedItem){
        selectedItem.classList.remove('selected');
        selectedItem = null;
      }
    }
  });

  // ---------- Прогресс ----------
  // ---------- Экран поздравления при 100% ----------
  const TRUE_LABEL = 'Верно';
  const FALSE_LABEL = 'Неверно';
  const CHECK_BUTTON_TEXT = 'Проверить';
  const COMPLETION_ENABLED = true;
  const completionScreen = document.getElementById('completion-screen');
  const completionImage = document.getElementById('completion-image');
  const completionClose = document.getElementById('completion-close');
  let completionShown = false;

  if (!completionImage.getAttribute('src')){
    completionImage.style.display = 'none';
  }

  completionClose.addEventListener('click', () => {
    completionScreen.classList.remove('visible');
  });

  function updateProgress(){
    const done = categories.reduce((sum, c) => {
      return sum + (c.solved ? 1 : 0) + (c.placed ? 1 : 0);
    }, 0);
    const pct = Math.min(100, Math.round((done / totalSteps) * 100));
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';

    if (pct === 100 && !completionShown && COMPLETION_ENABLED){
      completionShown = true;
      setTimeout(() => {
        completionScreen.classList.add('visible');
        launchConfetti();
        playCompletionSound();
      }, 400);
    }
  }

})();
</script>
</body>
</html>
