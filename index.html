  function buildFormulasCheatsheet(container){
    container.innerHTML = `
      <div class="section-hint" style="margin-top:0;">Жми «Копировать» и вставляй прямо в вопрос или вариант ответа — знаки $...$ уже внутри, ничего дописывать не нужно.</div>
    `;

    FORMULA_CHEATSHEET.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'formula-group';
      const heading = document.createElement('h3');
      heading.textContent = group.title;
      groupEl.appendChild(heading);

      group.items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'formula-row';
        row.innerHTML = `
          <div class="formula-code">${escapeHtml(item.code)}</div>
          <div class="formula-preview">${escapeHtml(item.code)}</div>
          <button class="formula-copy-btn">Копировать</button>
        `;
        row.querySelector('.formula-copy-btn').addEventListener('click', (e) => {
          navigator.clipboard.writeText(item.code).then(() => {
            const btn = e.target;
            const old = btn.textContent;
            btn.textContent = 'Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200);
          });
        });
        groupEl.appendChild(row);
      });

      container.appendChild(groupEl);
    });

    if (window.renderMathInElement){
      container.querySelectorAll('.formula-preview').forEach(el => {
        renderMathInElement(el, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      });
    }
  }

    });
    wrap.querySelector('#sound-test-correct').addEventListener('click', () => testPlaySound('correct'));
    wrap.querySelector('#sound-test-wrong').addEventListener('click', () => testPlaySound('wrong'));
    wrap.querySelector('#sound-test-completion').addEventListener('click', () => testPlaySound('completion'));
  }

  // ---------- Вкладка: Экспорт ----------
  function renderExportTab(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="section-title"><h2>Экспорт</h2></div>
      <div id="export-panel">
        <button id="download-btn">Скачать HTML</button>
        <button id="copy-btn">Скопировать код для iframe</button>
        <div id="export-info"></div>
      </div>

      <div class="section-hint" style="margin-top:18px;">Все изменения сохраняются автоматически в этом браузере — можно закрыть вкладку и продолжить позже.</div>

      <div class="section-hint" style="margin-top:14px; color:var(--gold-soft); font-weight:700;">Резервная копия настроек редактора</div>
      <div class="section-hint">Если автосохранение вдруг подведёт (другой браузер, другой компьютер, очистка кеша) — сохрани резервную копию в файл и потом загрузи её обратно.</div>
      <button class="add-btn" id="save-file-btn" style="margin-top:6px;">💾 Сохранить в файл</button>
      <button class="add-btn" id="load-file-btn" style="margin-left:10px;">📂 Загрузить из файла</button>
      <input type="file" id="load-file-input" accept="application/json,.json" style="display:none;">

      <div class="section-hint" style="margin-top:18px;"></div>
      <button class="cat-remove" id="reset-state-btn" style="margin-top:6px;">Сбросить к примеру</button>

      <div id="instructions">
        <h3>Как встроить игру в Genially</h3>
        <ol>
          <li><b>Скачать HTML</b> — получишь один готовый файл игры. Залей его на свой GitHub (тот же репозиторий, что и картинки) через <code>Add file → Upload files</code>, возьми ссылку вида <code>https://твой-логин.github.io/название-репозитория/имя-файла.html</code> и вставь как источник для iframe-элемента в Genially.</li>
          <li><b>Скопировать код для iframe</b> — копирует готовый тег <code>&lt;iframe srcdoc="..."&gt;</code> с игрой прямо внутри. Если в Genially есть блок «вставить HTML/код» — можно вставить туда напрямую, без загрузки файла на GitHub.</li>
        </ol>
      </div>

      <div id="instructions" style="margin-top:16px; border-color:rgba(226,87,76,0.35);">
        <h3 style="color:var(--danger);">Если файл не проходит в Genially (перегруз)</h3>
        <ol>
          <li>Смотри размер файла после «Скачать HTML» — если сильно больше 1–2 МБ, дело почти всегда в картинках, загруженных «с компьютера» (кнопка 📁): они превращаются в base64 и сильно раздувают файл.</li>
          <li>Замени такие картинки на обычные ссылки — залей их на GitHub (как остальные) и вставь ссылку вместо файла. Это САМОЕ частое решение.</li>
          <li>Если используешь <b>«Скопировать код для iframe»</b> — попробуй вместо этого вариант с GitHub-ссылкой: у вставки кода в Genially обычно более жёсткий лимит по размеру, чем у iframe с внешней ссылкой.</li>
          <li>Слишком много категорий/предметов в одной игре — раздели на 2 отдельные игры (например, по 4-5 категорий) и вставь как два разных блока в Genially.</li>
          <li>Если ничего не помогает — напиши мне, пришлю облегчённую версию файла.</li>
        </ol>
      </div>
    `;
    tabContent.appendChild(wrap);

    wrap.querySelector('#reset-state-btn').addEventListener('click', () => {
      if (!confirm('Стереть все изменения и вернуться к примеру? Это нельзя отменить.')) return;
      clearSavedState();
      location.reload();
    });

    wrap.querySelector('#save-file-btn').addEventListener('click', () => {
      const backup = {
        locations: state.locations,
        categories: state.categories,
        design: state.design,
        taskStyle: state.taskStyle,
        sound: state.sound,
        text: state.text,
        completion: state.completion,
        locationSelectEnabled: state.locationSelectEnabled,
        locationScreen: state.locationScreen,
        fontPreset: state.fontPreset,
        lang: state.lang
      };
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'room-editor-config.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      wrap.querySelector('#export-info').textContent = 'Файл настроек редактора сохранён';
    });

    wrap.querySelector('#load-file-btn').addEventListener('click', () => {
      wrap.querySelector('#load-file-input').click();
    });

    wrap.querySelector('#load-file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const saved = JSON.parse(reader.result);
          if (saved.locations) state.locations = saved.locations;
          if (saved.categories) state.categories = saved.categories;
          if (saved.design) state.design = Object.assign({}, state.design, saved.design);
          if (saved.taskStyle) state.taskStyle = Object.assign({}, state.taskStyle, saved.taskStyle);
          if (saved.sound) state.sound = Object.assign({}, state.sound, saved.sound);
          if (saved.text) state.text = Object.assign({}, state.text, saved.text);
          if (saved.completion) state.completion = Object.assign({}, state.completion, saved.completion);
          if (typeof saved.locationSelectEnabled === 'boolean') state.locationSelectEnabled = saved.locationSelectEnabled;
          if (saved.locationScreen) state.locationScreen = Object.assign({}, state.locationScreen, saved.locationScreen);
          if (saved.fontPreset) state.fontPreset = saved.fontPreset;
          if (saved.lang) state.lang = saved.lang;
          saveState();
          renderTabsBar();
          renderTabContent();
          updatePreviewNow();
          const freshInfo = document.getElementById('export-info');
          if (freshInfo) freshInfo.textContent = 'Настройки загружены из файла';
        } catch (err) {
          alert('Не удалось прочитать файл — убедись, что это тот самый файл настроек редактора.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    wrap.querySelector('#download-btn').addEventListener('click', () => {
      const html = generateHTML();
      const blob = new Blob([html], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'room-play.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      const kb = Math.round(blob.size / 1024);
      wrap.querySelector('#export-info').textContent = `Файл готов — ${kb} КБ`;
    });

    wrap.querySelector('#copy-btn').addEventListener('click', () => {
      const html = generateHTML();
      const iframeCode = `<iframe srcdoc="${escapeAttr(html)}" style="width:100%;height:700px;border:none;" allow="autoplay"></iframe>`;
      navigator.clipboard.writeText(iframeCode).then(() => {
        wrap.querySelector('#export-info').textContent = 'Код iframe скопирован в буфер обмена';
      }).catch(() => {
        wrap.querySelector('#export-info').textContent = 'Не удалось скопировать — попробуй скачать HTML вместо этого';
      });
    });
  }

  // ---------- Инициализация ----------
  const hadSavedState = loadSavedState();
  renderTabsBar();
  renderTabContent();
  sizePreviewFrame();
  updatePreviewNow();
  if (hadSavedState){
    previewStatus.textContent = 'загружено сохранённое';
    setTimeout(() => { previewStatus.textContent = 'обновляется вживую'; }, 1500);
  }

})();
</script>
</body>
</html>
