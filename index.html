<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор комнаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --wall-deep: #2a2420;
    --wall-mid: #4a3d33;
    --wall-light: #6b5a4a;
    --gold: #8fb8dc;
    --gold-soft: #5c4630;
    --glow: #b98a63;
    --cream: #211c17;
    --ink: #f3e9d7;
    --danger: #d16a5a;
    --panel: #241f1a;
    --panel-light: #3a3128;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    color:var(--cream);
  }
  h1,h2,h3{
    font-family:'Cormorant Garamond', serif;
    margin:0;
  }
  #app{ max-width:1800px; margin:0 auto; padding:26px 22px 80px; }

  /* ---------- Шапка ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding-bottom:20px; margin-bottom:22px;
    border-bottom:1px solid rgba(143,184,220,0.25);
  }
  header h1{ font-size:30px; color:var(--gold-soft); font-weight:700; }
  header p{ margin:4px 0 0; font-size:13.5px; color:rgba(58,47,34,0.65); }

  /* ---------- Сплит: редактор + превью ---------- */
  #main-layout{
    display:flex; gap:24px; align-items:flex-start;
  }
  #editor-col{ flex:1 1 0; min-width:0; max-width:640px; }
  #preview-col{
    flex:1 1 0;
    min-width:520px;
    position:sticky; top:20px;
  }
  #preview-frame-wrap{
    position:relative;
    border:2px solid rgba(143,184,220,0.35);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }
  #preview-frame{
    display:block;
    width:100%; height:640px;
    border:none;
    background:#0e0b08;
  }
  #preview-grid-overlay{
    position:absolute; inset:0;
    pointer-events:none;
    display:none;
    background-image:
      repeating-linear-gradient(to right, rgba(255,130,52,0.35) 0, rgba(255,130,52,0.35) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(to bottom, rgba(255,130,52,0.35) 0, rgba(255,130,52,0.35) 1px, transparent 1px, transparent 40px);
  }
  #preview-grid-overlay.visible{ display:block; }
  #preview-label{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  #preview-label h2{ font-size:20px; color:var(--gold-soft); }
  #preview-status{
    font-size:11.5px; color:rgba(185,138,99,0.9);
  }
  #preview-controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:10px;
  }
  .grid-toggle{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:rgba(58,47,34,0.75);
    white-space:nowrap;
  }
  #grid-step-input{ width:64px; }
  #preview-controls .add-btn{ font-size:12.5px; padding:6px 12px; }

  #app.preview-fullscreen #editor-col{ display:none; }
  #app.preview-fullscreen #main-layout{ display:block; }
  #app.preview-fullscreen #preview-col{ width:100%; max-width:none; }
  #app.preview-fullscreen #preview-frame{ height:calc(100vh - 220px); }

  @media (max-width: 1280px){
    #main-layout{ flex-direction:column; }
    #editor-col{ max-width:none; }
    #preview-col{ position:static; width:100%; min-width:0; }
    #preview-frame{ height:640px; }
  }

  /* ---------- Вкладки ---------- */
  #tabs-bar{
    display:flex; gap:4px; flex-wrap:wrap;
    margin-bottom:20px;
    border-bottom:1px solid rgba(143,184,220,0.3);
  }
  .tab-btn{
    padding:10px 15px;
    background:none; border:none;
    border-bottom:3px solid transparent;
    font-size:13.5px; font-weight:700;
    color:rgba(58,47,34,0.5);
    cursor:pointer;
    font-family:'Nunito Sans', sans-serif;
    transition:color .15s ease;
  }
  .tab-btn:hover{ color:var(--gold-soft); }
  .tab-btn.active{ color:var(--gold-soft); border-bottom-color:var(--gold); }

  /* ---------- Секции ---------- */
  .section-title{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .section-title h2{ font-size:20px; color:var(--gold-soft); }
  .section-hint{ font-size:12.5px; color:rgba(58,47,34,0.6); margin:-8px 0 16px; }
  .add-btn{
    background:rgba(185,138,99,0.15);
    color:var(--glow);
    border:1px solid rgba(185,138,99,0.5);
    padding:8px 16px;
    border-radius:9px;
    font-size:13px; font-weight:700;
    cursor:pointer;
    transition:background .15s ease;
  }
  .add-btn:hover{ background:rgba(185,138,99,0.28); }

  /* ---------- Локации ---------- */
  #locations-list{ display:flex; flex-wrap:wrap; gap:14px; }
  .location-row{
    display:flex; align-items:center; gap:8px;
    background:var(--panel);
    border:1px solid rgba(143,184,220,0.2);
    border-radius:10px;
    padding:8px 10px;
    width:310px;
  }
  .location-thumb{
    width:44px; height:34px;
    border-radius:6px;
    background-size:cover; background-position:center;
    background-color:var(--panel-light);
    flex:0 0 auto;
  }
  .location-row input{ flex:1; min-width:0; }
  .upload-btn{
    flex:0 0 auto;
    background:none;
    border:1px solid rgba(143,184,220,0.4);
    color:var(--gold);
    width:26px; height:26px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
    line-height:1;
  }
  .upload-btn:hover{ background:rgba(143,184,220,0.15); }
  .remove-btn{
    flex:0 0 auto;
    background:none;
    border:1px solid rgba(209,106,90,0.5);
    color:var(--danger);
    width:26px; height:26px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px; font-weight:700;
    line-height:1;
  }
  .remove-btn:hover{ background:rgba(209,106,90,0.15); }

  input[type="text"], input[type="number"], input[type="color"], textarea, select{
    background:var(--wall-deep);
    border:1px solid rgba(143,184,220,0.3);
    color:var(--gold);
    border-radius:7px;
    padding:8px 10px;
    font-family:'Nunito Sans', sans-serif;
    font-size:13.5px;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--gold);
  }
  input::placeholder, textarea::placeholder{ color:rgba(143,184,220,0.45); }

  /* ---------- Категории ---------- */
  .category-card{
    background:var(--panel);
    border:1px solid rgba(143,184,220,0.22);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .cat-top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  .cat-top input[type="text"].cat-label{
    font-size:17px; font-weight:700; font-family:'Cormorant Garamond', serif;
    color:var(--gold);
    flex:1; min-width:160px;
    background:transparent; border:none; border-bottom:1px solid rgba(143,184,220,0.3);
    border-radius:0; padding:4px 2px;
  }
  .cat-active-toggle{ display:flex; align-items:center; gap:6px; font-size:13px; color:rgba(250,230,216,0.75); white-space:nowrap; }
  .cat-basesize{ display:flex; align-items:center; gap:6px; font-size:13px; color:rgba(250,230,216,0.75); white-space:nowrap; }
  .cat-basesize input{ width:64px; }
  .cat-remove{
    background:none; border:1px solid rgba(209,106,90,0.5); color:var(--danger);
    padding:6px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; font-weight:700;
  }
  .cat-remove:hover{ background:rgba(209,106,90,0.15); }

  .cat-body{ display:flex; gap:22px; flex-wrap:wrap; }
  .cat-task{ flex:1; min-width:260px; }
  .cat-items{ flex:1; min-width:260px; }

  .field-label{
    display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:rgba(250,230,216,0.45); margin:0 0 5px;
  }
  .cat-task input[type="text"]{ width:100%; margin-bottom:10px; }
  .option-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .option-row input[type="radio"]{ accent-color:var(--glow); flex:0 0 auto; }
  .option-row input[type="text"]{ flex:1; }
  .option-hint{ font-size:11px; color:rgba(250,230,216,0.4); margin:2px 0 12px; }

  .item-row, .qimg-row, .pair-row, .order-edit-row, .word-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .item-thumb{
    width:36px; height:36px; border-radius:6px; flex:0 0 auto;
    background-size:contain; background-position:center; background-repeat:no-repeat;
    background-color:var(--panel-light);
  }
  .item-row input[type="text"]{ flex:1; min-width:0; }
  .add-item-btn{
    margin-top:4px;
    background:none; border:1px dashed rgba(143,184,220,0.5); color:var(--gold-soft);
    padding:7px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; width:100%;
  }
  .add-item-btn:hover{ background:rgba(143,184,220,0.1); }

  /* ---------- Текст / шрифт ---------- */
  .field-block{
    margin-bottom:20px;
    background:var(--panel);
    border:1px solid rgba(143,184,220,0.2);
    border-radius:12px;
    padding:16px 18px;
  }
  .field-block label.title{
    display:block; font-size:13px; font-weight:700; color:var(--gold-soft); margin-bottom:6px;
  }
  .field-block select, .field-block input[type="text"]{ width:100%; }
  .font-preview{
    margin-top:10px; padding:14px 16px;
    background:var(--panel); border:1px solid rgba(143,184,220,0.2); border-radius:10px;
  }
  .font-preview .fp-h{ font-size:22px; color:var(--gold-soft); margin-bottom:4px; }
  .font-preview .fp-b{ font-size:13.5px; color:rgba(250,230,216,0.75); }

  /* ---------- Редактор текста ---------- */
  .text-field-row{ margin-bottom:16px; }
  .text-field-row label{
    display:block; font-size:12px; color:rgba(58,47,34,0.65); margin-bottom:5px;
  }
  .text-field-row input[type="text"]{ width:100%; }

  /* ---------- Дизайн ---------- */
  .color-row{
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .color-row label{ flex:1; font-size:13.5px; color:rgba(58,47,34,0.75); }
  .color-row input[type="color"]{
    width:46px; height:34px; padding:2px; cursor:pointer;
  }
  .design-preview{
    margin-top:6px; padding:18px;
    background:#1c1430; border-radius:14px;
    display:flex; flex-direction:column; gap:9px;
  }
  .design-opt-demo{
    padding:10px 14px; border-radius:9px; border:1px solid; font-size:13.5px;
    background:rgba(255,255,255,0.05); color:#f3ead9;
  }

  /* ---------- Экспорт ---------- */
  #export-panel{
    background:var(--panel);
    border:1px solid rgba(185,138,99,0.3);
    border-radius:14px;
    padding:20px 22px;
  }
  #download-btn, #copy-btn{
    display:inline-block;
    background:linear-gradient(180deg, var(--gold), #5f8fc0);
    color:#211c17;
    border:none;
    padding:13px 22px;
    border-radius:12px;
    font-size:14.5px; font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(143,184,220,0.35);
    transition:transform .15s ease;
    margin-right:10px; margin-bottom:10px;
  }
  #copy-btn{
    background:linear-gradient(180deg, var(--glow), #8a5c3a);
    box-shadow:0 6px 18px rgba(185,138,99,0.35);
  }
  #download-btn:hover, #copy-btn:hover{ transform:translateY(-2px); }
  #export-info{ font-size:12.5px; color:rgba(250,230,216,0.75); margin-top:4px; }
  #instructions{
    margin-top:22px;
    font-size:13.5px;
    line-height:1.6;
    color:rgba(250,230,216,0.85);
    background:var(--panel);
    border:1px solid rgba(143,184,220,0.25);
    border-radius:14px;
    padding:20px 22px;
  }
  #instructions h3{ color:var(--glow); font-size:17px; margin-bottom:10px; }
  #instructions ol{ margin:0; padding-left:20px; }
  #instructions li{ margin-bottom:6px; }
  #instructions code{
    background:rgba(185,138,99,0.15);
    padding:1px 6px; border-radius:5px;
    color:var(--gold-soft);
    font-size:12.5px;
  }

  /* ---------- Шпаргалка формул ---------- */
  .formula-group{ margin-bottom:26px; }
  .formula-group h3{
    font-size:16px; color:var(--glow); margin-bottom:10px;
  }
  .formula-row{
    display:flex; align-items:center; gap:10px;
    background:var(--panel);
    border:1px solid rgba(143,184,220,0.2);
    border-radius:9px;
    padding:9px 12px;
    margin-bottom:8px;
  }
  .formula-code{
    flex:1 1 40%;
    font-family:monospace;
    font-size:12.5px;
    color:var(--gold);
    background:var(--wall-deep);
    border-radius:6px;
    padding:6px 9px;
    white-space:pre-wrap;
    word-break:break-all;
  }
  .formula-preview{
    flex:1 1 30%;
    color:rgba(250,230,216,0.9);
    font-size:15px;
    text-align:center;
    min-width:0;
    overflow-x:auto;
  }
  .formula-copy-btn{
    flex:0 0 auto;
    background:none;
    border:1px solid rgba(143,184,220,0.5);
    color:var(--gold);
    padding:6px 12px;
    border-radius:7px;
    font-size:12px; font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .formula-copy-btn:hover{ background:rgba(143,184,220,0.15); }
  .formula-copy-btn.copied{ border-color:var(--glow); color:var(--glow); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>Редактор комнаты</h1>
      <p>Настрой локации, задания, текст и дизайн — потом скачай готовую игру одним файлом</p>
    </div>
  </header>

  <div id="main-layout">
    <div id="editor-col">

      <div id="tabs-bar"></div>
      <div id="tab-content"></div>

    </div>

    <div id="preview-col">
      <div id="preview-label">
        <h2>Превью</h2>
        <span id="preview-status">обновляется вживую</span>
      </div>

      <div id="preview-controls">
        <button class="add-btn" id="preview-test-btn" type="button">▶ Тест в новой вкладке</button>
      </div>

      <div id="preview-frame-wrap">
        <iframe id="preview-frame"></iframe>
      </div>
    </div>
  </div>

</div>

<script>
(function(){

  const ENGINE_TEMPLATE = "<!DOCTYPE html>\n<html lang=\"__LANG__\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\u041a\u043e\u043c\u043d\u0430\u0442\u0430 \u2014 \u043f\u0440\u043e\u0442\u043e\u0442\u0438\u043f \u043c\u0435\u0445\u0430\u043d\u0438\u043a\u0438</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"__FONT_LINK__\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js\"><\/script>\n<style>\n  :root{\n    --wall-deep: #2c2116;\n    --wall-mid: #4a3a26;\n    --wall-light: #6b5236;\n    --gold: __COLOR_GOLD__;\n    --gold-soft: __COLOR_GOLD_SOFT__;\n    --glow: __COLOR_GLOW__;\n    --cream: #fae6d8;\n    --ink: #201a13;\n    --danger: __COLOR_DANGER__;\n    --panel-a: __PANEL_A__;\n    --panel-b: __PANEL_B__;\n    --panel-c: __PANEL_C__;\n  }\n  *{box-sizing:border-box;}\n  html,body{\n    margin:0; padding:0; height:100%;\n    background:var(--ink);\n    font-family:__FONT_BODY__;\n    color:var(--cream);\n    overflow:hidden;\n    -webkit-user-select:none; user-select:none;\n  }\n  #app{\n    width:100%; height:100%;\n    display:flex; flex-direction:column;\n    position:relative;\n  }\n\n  /* ---------- \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 ---------- */\n  #progress-bar{\n    position:absolute;\n    top:14px; left:14px; right:224px;\n    display:flex; align-items:center; gap:14px;\n    z-index:20;\n  }\n  #progress-track{\n    flex:1;\n    height:22px;\n    border-radius:999px;\n    background:rgba(255,255,255,0.12);\n    backdrop-filter:blur(16px) saturate(180%);\n    -webkit-backdrop-filter:blur(16px) saturate(180%);\n    border:1px solid rgba(255,255,255,0.25);\n    overflow:hidden \u043d\u0438\u044f ---------- */\n  #task-overlay{\n    position:fixed; inset:0;\n    background:rgba(10,7,16,0.72);\n    display:none; align-items:center; justify-content:center;\n    z-index:50;\n  }\n  #task-overlay.visible{ display:flex; }\n\n  /* ---------- \u042d\u043a\u0440\u0430\u043d \u043f\u043e\u0437\u0434\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u043f\u0440\u0438 100% ---------- */\n  #completion-screen{\n    position:fixed; inset:0;\n    background:rgba(10,7,16,0.82);\n    display:none; align-items:center; justify-content:center;\n    z-index:200;\n    padding:24px;\n  }\n  #completion-screen.visible{ display:flex; }\n  #confetti-layer{\n    position:fixed; inset:0;\n    pointer-events:none;\n    z-index:210;\n    overflow:hidden;\n  }\n  .confetti-piece{\n    position:absolute;\n    top:-12px;\n    width:8px; height:14px;\n    opacity:0.95;\n    animation-name:confetti-fall;\n    animation-timing-function:cubic-bezier(.4,.2,.6,1);\n    animation-fill-mode:forwards;\n  }\n  @keyframes confetti-fall{\n    0%{ transform:translateY(0) rotate(0deg); opacity:1; }\n    100%{ transform:translateY(112vh) rotate(420deg); opacity:0.25; }\n  }\n  .completion-card{\n    position:relative;\n    background:__GLASS_TINT_MODAL__;\n    backdrop-filter:blur(26px) saturate(180%);\n    -webkit-backdrop-filter:blur(26px) saturate(180%);\n    border:1px solid rgba(255,255,255,0.16);\n    border-radius:20px;\n    padding:32px 34px;\n    width:min(400px, 90vw);\n    max-height:88vh;\n    overflow-y:auto;\n    text-align:center;\n    box-shadow:0 0 22px rgba(255,130,52,0.4), 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);\n    animation:completion-pop 0.5s cubic-bezier(.34,1.56,.64,1), completion-neon-pulse 2.4s ease-in-out infinite 0.5s;\n  }\n  @keyframes completion-pop{\n    0%{ transform:scale(0.7); opacity:0; }\n    100%{ transform:scale(1); opacity:1; }\n  }\n  @keyframes completion-neon-pulse{\n    0%,100%{ box-shadow:0 0 22px rgba(255,130,52,0.55), 0 0 50px rgba(255,130,52,0.3), 0 24px 60px rgba(0,0,0,0.55); }\n    50%{ box-shadow:0 0 34px rgba(255,130,52,0.85), 0 0 76px rgba(255,130,52,0.5), 0 24px 60px rgba(0,0,0,0.55); }\n  }\n  .completion-star{\n    font-size:38px;\n    letter-spacing:6px;\n    margin-bottom:6px;\n    color:var(--gold);\n  }\n  .completion-star span{\n    display:inline-block;\n    text-shadow:0 0 14px rgba(255,130,52,0.85), 0 0 28px rgba(255,130,52,0.5);\n    animation:star-pop 0.45s ease-out backwards;\n  }\n  .completion-star span:nth-child(1){ animation-delay:0.15s; }\n  .completion-star span:nth-child(2){ animation-delay:0.32s; }\n  .completion-star span:nth-child(3){ animation-delay:0.49s; }\n  @keyframes star-pop{\n    0%{ transform:scale(0) rotate(-35deg); opacity:0; }\n    70%{ transform:scale(1.25) rotate(8deg); opacity:1; }\n    100%{ transform:scale(1) rotate(0deg); opacity:1; }\n  }\n  .completion-title{\n    font-family:__FONT_DISPLAY__;\n    font-size:28px; font-weight:700;\n    color:var(--gold-soft);\n    margin-bottom:8px;\n    text-shadow:0 0 18px rgba(255,130,52,0.35);\n  }\n  .completion-sub{\n    font-size:14px;\n    color:rgba(243,234,217,0.85);\n    margin-bottom:18px;\n    line-height:1.4;\n  }\n  .completion-image{\n    width:100%; max-width:260px;\n    border-radius:14px;\n    margin:0 auto 20px;\n    display:block;\n    box-shadow:0 10px 26px rgba(0,0,0,0.4);\n  }\n  .completion-btn{\n    background:linear-gradient(180deg, var(--gold), #e6691c);\n    color:var(--ink);\n    border:none;\n    padding:12px 30px;\n    border-radius:12px;\n    font-size:15px; font-weight:700;\n    cursor:pointer;\n    box-shadow:0 0 14px rgba(255,130,52,0.5);\n    transition:transform .15s ease;\n  }\n  .completion-btn:hover{ transform:translateY(-2px); }\n  #task-card{\n    background:__TASK_CARD_BG__;\n    backdrop-filter:blur(24px) saturate(180%);\n    -webkit-backdrop-filter:blur(24px) saturate(180%);\n    border:1px solid rgba(255,255,255,0.14);\n    border-radius:16px;\n    padding:28px 30px;\n    width:min(420px, 88vw);\n    box-shadow:0 0 24px __TASK_CARD_GLOW__, 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);\n  }\n  #task-card h3{\n    font-family:__FONT_DISPLAY__;\n    font-size:26px;\n    color:var(--gold-soft);\n    margin:0 0 6px;\n  }\n  #task-card p{\n    font-size:__TASK_QUESTION_SIZE__px;\n    color:__TASK_QUESTION_COLOR__;\n    margin:0 0 18px;\n    line-height:1.4;\n  }\n  #task-card .katex{ color:inherit; font-size:1.05em; }\n  #task-card .katex-display{ margin:8px 0; }\n  #task-question-image{\n    display:block;\n    width:100%; max-height:180px;\n    object-fit:contain;\n    border-radius:12px;\n    margin:0 0 14px;\n    background:rgba(0,0,0,0.15);\n  }\n  .task-opt-image{\n    display:block;\n    width:100%; max-height:120px;\n    object-fit:contain;\n    border-radius:8px;\n    margin-bottom:6px;\n  }\n  .task-options{ display:flex; flex-direction:column; gap:10px; }\n  .task-opt{\n    background:__TASK_ANSWER_BG__;\n    backdrop-filter:blur(10px);\n    -webkit-backdrop-filter:blur(10px);\n    border:1px solid __TASK_ANSWER_BORDER__;\n    color:__TASK_ANSWER_COLOR__;\n    padding:11px 14px;\n    border-radius:10px;\n    font-size:__TASK_ANSWER_SIZE__px;\n    text-align:left;\n    cursor:pointer;\n    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;\n  }\n  .task-opt:hover{ background:rgba(255,255,255,0.1); box-shadow:0 0 12px rgba(255,130,52,0.4); }\n  .task-opt.correct{ background:rgba(163,191,111,0.22); border-color:var(--glow); }\n  .task-opt.wrong{ background:rgba(226,87,76,0.22); border-color:var(--danger); }\n\n  /* \u0412\u0435\u0440\u043d\u043e / \u043d\u0435\u0432\u0435\u0440\u043d\u043e */\n  .tf-row{ display:flex; gap:12px; }\n  .tf-btn{\n    flex:1;\n    background:__TASK_ANSWER_BG__;\n    backdrop-filter:blur(10px);\n    -webkit-backdrop-filter:blur(10px);\n    border:1px solid __TASK_ANSWER_BORDER__;\n    color:__TASK_ANSWER_COLOR__;\n    padding:14px; border-radius:10px;\n    font-size:__TASK_ANSWER_SIZE__px; font-weight:700;\n    cursor:pointer;\n    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;\n  }\n  .tf-btn:hover{ background:rgba(255,255,255,0.1); box-shadow:0 0 12px rgba(255,130,52,0.4); }\n  .tf-btn.correct{ background:rgba(163,191,111,0.22); border-color:var(--glow); }\n  .tf-btn.wrong{ background:rgba(226,87,76,0.22); border-color:var(--danger); }\n\n  /* \u0412\u0432\u043e\u0434 \u043e\u0442\u0432\u0435\u0442\u0430 */\n  .input-row{ display:flex; gap:10px; }\n  .input-field{\n    flex:1;\n    background:__TASK_INPUT_BG__;\n    backdrop-filter:blur(10px);\n    -webkit-backdrop-filter:blur(10px);\n    border:1px solid __TASK_ANSWER_BORDER__;\n    color:__TASK_ANSWER_COLOR__;\n    padding:11px 14px; border-radius:10px;\n    font-size:__TASK_ANSWER_SIZE__px;\n  }\n  .input-field:focus{ outline:none; box-shadow:0 0 12px rgba(255,130,52,0.5); }\n  .input-check-btn{\n    background:var(--gold); color:var(--ink);\n    border:none; padding:0 18px; border-radius:10px;\n    font-size:14px; font-weight:700; cursor:pointer;\n  }\n  .input-field.wrong{ border-color:#e2574c; }\n  .input-field.correct{ border-color:#a3bf6f; }\n  .input-feedback{ font-size:12.5px; margin-top:8px; min-height:16px; }\n  .input-feedback.wrong{ color:#e2574c; }\n  .input-feedback.correct{ color:#a3bf6f; }\n\n  /* \u0421\u043e\u043f\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043f\u0430\u0440 */\n  .match-columns{ display:flex; gap:16px; }\n  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }\n  .match-pill{\n    background:#3d2a1a;\n    border:1px solid #ff8234;\n    color:#fae6d8;\n    padding:9px 12px; border-radius:9px;\n    font-size:13.5px; text-align:left; cursor:pointer;\n    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;\n  }\n  .match-pill:hover{ box-shadow:0 0 12px rgba(255,130,52,0.5); }\n  .match-pill.selected{ border-color:#ff8234; background:rgba(255,130,52,0.25); }\n  .match-pill.matched{ border-color:#a3bf6f; background:rgba(163,191,111,0.2); cursor:default; opacity:0.85; }\n  .match-pill.wrong-flash{ border-color:#e2574c; background:rgba(226,87,76,0.25); }\n\n  /* \u0420\u0430\u0441\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043f\u043e \u043f\u043e\u0440\u044f\u0434\u043a\u0443 */\n  .order-list{ display:flex; flex-direction:column; gap:8px; }\n  .order-item{\n    display:flex; align-items:center; gap:10px;\n    background:#3d2a1a;\n    border:1px solid #ff8234;\n    color:#fae6d8;\n    padding:9px 12px; border-radius:9px;\n    font-size:13.5px;\n  }\n  .order-item .order-text{ flex:1; }\n  .order-move-btn{\n    background:none; border:1px solid #ff8234;\n    color:var(--gold-soft); width:26px; height:26px; border-radius:6px;\n    cursor:pointer; font-size:13px; line-height:1;\n  }\n  .order-move-btn:disabled{ opacity:0.3; cursor:default; }\n  .order-check-btn{\n    margin-top:14px; width:100%;\n    background:#ff8234; color:var(--ink);\n    border:none; padding:11px; border-radius:10px;\n    font-size:14px; font-weight:700; cursor:pointer;\n  }\n  .order-feedback{ font-size:12.5px; margin-top:8px; min-height:16px; }\n  .order-feedback.wrong{ color:#e2574c; }\n  .order-feedback.correct{ color:#a3bf6f; }\n\n  /* \u0421\u043e\u0431\u0435\u0440\u0438 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 */\n  .sentence-assembled{\n    min-height:40px;\n    padding:10px 12px;\n    border:1px dashed #ff8234;\n    border-radius:10px;\n    margin-bottom:14px;\n    font-size:15.5px;\n    color:#fae6d8;\n    line-height:1.5;\n  }\n  .sentence-placeholder{ color:rgba(243,234,217,0.35); font-style:italic; }\n  .sentence-chips{ display:flex; flex-wrap:wrap; gap:8px; }\n  .sentence-chip{\n    background:#3d2a1a;\n    border:1px solid #ff8234;\n    color:#fae6d8;\n    padding:8px 14px;\n    border-radius:9px;\n    font-size:14px;\n    cursor:pointer;\n    transition:background .15s ease, box-shadow .15s ease;\n  }\n  .sentence-chip:hover{ box-shadow:0 0 12px rgba(255,130,52,0.5); }\n  .sentence-chip.used{ opacity:0.3; cursor:default; }\n  .sentence-chip.shake{\n    border-color:#e2574c;\n    animation:chip-shake 0.4s ease;\n  }\n  @keyframes chip-shake{\n    0%,100%{ transform:translateX(0); }\n    25%{ transform:translateX(-5px); }\n    75%{ transform:translateX(5px); }\n  }\n\n  #task-close{\n    margin-top:18px;\n    background:none; border:none;\n    color:rgba(243,234,217,0.5);\n    font-size:13px; cursor:pointer;\n    text-decoration:underline;\n  }\n</style>\n</head>\n<body>\n<div id=\"app\">\n\n  <div id=\"progress-bar\">\n    <div id=\"progress-track\"><div id=\"progress-fill\"></div></div>\n    <div id=\"progress-pct\">0%</div>\n    <button id=\"sound-toggle\" title=\"\u0417\u0432\u0443\u043a\">\ud83d\udd0a</button>\n  </div>\n\n  <div id=\"location-screen\">\n    <div id=\"location-screen-title\" class=\"__LOCATION_NEON_CLASS__\">__TEXT_LOCATION_TITLE__</div>\n    <div id=\"location-screen-sub\">__TEXT_LOCATION_SUB__</div>\n    <div id=\"location-grid\"></div>\n  </div>\n\n  <div id=\"room\">\n    <div id=\"room-visual\">\n      <div class=\"wall-seg\"></div>\n      <div class=\"wall-seg\"></div>\n      <div class=\"wall-seg\"></div>\n    </div>\n\n    <div id=\"category-list\">\n      <div id=\"category-list-title\">__TEXT_CATEGORY_TITLE__</div>\n    </div>\n  </div>\n\n  <div id=\"tray\">\n    <div class=\"empty-note\">__TEXT_TRAY_EMPTY__</div>\n  </div>\n\n  <div id=\"task-overlay\">\n    <div id=\"task-card\">\n      <h3 id=\"task-title\">\u0417\u0430\u0434\u0430\u043d\u0438\u0435</h3>\n      <img id=\"task-question-image\" src=\"\" alt=\"\" style=\"display:none;\">\n      <p id=\"task-question\"></p>\n      <div id=\"task-body\"></div>\n      <button id=\"task-close\">__TEXT_TASK_CLOSE__</button>\n    </div>\n  </div>\n\n  <div id=\"confetti-layer\"></div>\n\n  <div id=\"completion-screen\">\n    <div class=\"completion-card\">\n      <div class=\"completion-star\"><span>\u2605</span><span>\u2605</span><span>\u2605</span></div>\n      <div class=\"completion-title\">__TEXT_COMPLETION_TITLE__</div>\n      <div class=\"completion-sub\">__TEXT_COMPLETION_SUB__</div>\n      <img class=\"completion-image\" id=\"completion-image\" src=\"__COMPLETION_IMAGE__\" alt=\"\">\n      <button class=\"completion-btn\" id=\"completion-close\">__TEXT_COMPLETION_BUTTON__</button>\n    </div>\n  </div>\n\n</div>\n\n<script>\n(function(){\n\n  // ---------- \u041a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044f \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0439 (\u0434\u0435\u043c\u043e-\u0434\u0430\u043d\u043d\u044b\u0435 \u0440\u0435\u0434\u0430\u043a\u0442\u043e\u0440\u0430) ----------\n  const categories = __CATEGORIES_JSON__;\n\n  const totalSteps = categories.length * 2;\n\n  const room = document.getElementById('room-visual');\n  const categoryList = document.getElementById('category-list');\n  const tray = document.getElementById('tray');\n  const progressFill = document.getElementById('progress-fill');\n  const progressPct = document.getElementById('progress-pct');\n\n  const overlay = document.getElementById('task-overlay');\n  const taskTitle = document.getElementById('task-title');\n  const taskQuestion = document.getElementById('task-question');\n  const taskBody = document.getElementById('task-body');\n  const taskClose = document.getElementById('task-close');\n\n  let selectedItem = null;\n  let zCounter = 10;\n  let currentTaskCat = null;\n\n  // ---------- \u041b\u043e\u043a\u0430\u0446\u0438\u0438 (\u0444\u043e\u043d\u044b \u043a\u043e\u043c\u043d\u0430\u0442\u044b) ----------\n  const locations = __LOCATIONS_JSON__;\n\n  const locationGrid = document.getElementById('location-grid');\n  const locationScreen = document.getElementById('location-screen');\n  const LOCATION_SELECT_ENABLED = __LOCATION_SELECT_ENABLED__;\n\n  function setLocation(url){\n    room.style.backgroundImage = `url('${url}')`;\n  }\n\n  if (!LOCATION_SELECT_ENABLED){\n    if (locations.length) setLocation(locations[0].url);\n    locationScreen.style.display = 'none';\n  } else {\n    locations.forEach((loc, i) => {\n      const card = document.createElement('div');\n      card.className = 'location-card';\n      card.style.backgroundImage = `url('${loc.url}')`;\n      card.innerHTML = `<div class=\"location-card-label\">\u041a\u043e\u043c\u043d\u0430\u0442\u0430 ${i + 1}</div>`;\n      card.addEventListener('click', () => {\n        setLocation(loc.url);\n        locationScreen.style.display = 'none';\n      });\n      locationGrid.appendChild(card);\n    });\n  }\n\n  // ---------- \u041e\u0442\u0440\u0438\u0441\u043e\u0432\u043a\u0430 \u0441\u043f\u0438\u0441\u043a\u0430 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0439 \u0432 \u0441\u0430\u0439\u0434\u0431\u0430\u0440\u0435 \u0441\u043f\u0440\u0430\u0432\u0430 ----------\n  categories.forEach((cat) => {\n    const slot = document.createElement('div');\n    slot.className = 'lock-slot ' + (cat.active ? 'active' : 'disabled');\n    slot.dataset.catId = cat.id;\n    slot.innerHTML = `\n      <div class=\"lock-icon\">\ud83d\udd12</div>\n      <div class=\"lock-label\">${cat.label}</div>\n    `;\n    categoryList.appendChild(slot);\n\n    slot.addEventListener('click', () => {\n      if (cat.solved){\n        showCategoryTray(cat);\n        return;\n      }\n      if (!cat.active) return;\n      openTask(cat);\n    });\n  });\n\n  const taskQuestionImage = document.getElementById('task-question-image');\n\n  function openTask(cat){\n    currentTaskCat = cat;\n    const task = cat.task;\n    const type = task.type || 'quiz';\n    taskTitle.textContent = task.title;\n    taskQuestion.textContent = task.question || '';\n    taskBody.innerHTML = '';\n\n    if (task.questionImage){\n      taskQuestionImage.src = task.questionImage;\n      taskQuestionImage.style.display = 'block';\n    } else {\n      taskQuestionImage.style.display = 'none';\n    }\n\n    if (type === 'quiz') renderQuizTask(task);\n    else if (type === 'truefalse') renderTrueFalseTask(task);\n    else if (type === 'input') renderInputTask(task);\n    else if (type === 'match') renderMatchTask(task);\n    else if (type === 'order') renderOrderTask(task);\n    else if (type === 'sentence') renderSentenceTask(task);\n    else renderQuizTask(task);\n\n    overlay.classList.add('visible');\n    renderMathIn(document.getElementById('task-card'));\n  }\n\n  function renderMathIn(el){\n    if (window.renderMathInElement){\n      renderMathInElement(el, {\n        delimiters: [\n          {left: '$$', right: '$$', display: true},\n          {left: '$', right: '$', display: false}\n        ],\n        throwOnError: false\n      });\n    }\n  }\n\n  // ---------- \u0417\u0432\u0443\u043a\u0438 (\u0441\u0438\u043d\u0442\u0435\u0437 \u0447\u0435\u0440\u0435\u0437 Web Audio, \u0444\u0430\u0439\u043b\u044b \u043d\u0435 \u043d\u0443\u0436\u043d\u044b) ----------\n  const SOUND_STYLES = {\n    soft: {\n      correctType:'sine', correct:[523.25, 659.25, 783.99],\n      wrongType:'sawtooth', wrong:196,\n      completionType:'triangle', completion:[523.25, 659.25, 783.99, 1046.5]\n    },\n    bright: {\n      correctType:'triangle', correct:[659.25, 880, 1046.5],\n      wrongType:'square', wrong:220,\n      completionType:'square', completion:[659.25, 880, 1046.5, 1318.5]\n    },\n    retro: {\n      correctType:'square', correct:[440, 554.37, 659.25],\n      wrongType:'square', wrong:150,\n      completionType:'square', completion:[440, 554.37, 659.25, 880]\n    }\n  };\n  const SOUND_STYLE = SOUND_STYLES['__SOUND_STYLE__'] || SOUND_STYLES.soft;\n  const SOUND_VOLUME = __SOUND_VOLUME__;\n\n  let soundEnabled = __SOUND_ENABLED_DEFAULT__;\n  let audioCtx = null;\n\n  const soundToggleBtn = document.getElementById('sound-toggle');\n  soundToggleBtn.textContent = soundEnabled ? '\ud83d\udd0a' : '\ud83d\udd07';\n  soundToggleBtn.addEventListener('click', () => {\n    soundEnabled = !soundEnabled;\n    soundToggleBtn.textContent = soundEnabled ? '\ud83d\udd0a' : '\ud83d\udd07';\n  });\n\n  function getAudioCtx(){\n    if (!audioCtx){\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return null;\n      audioCtx = new AC();\n    }\n    if (audioCtx.state === 'suspended') audioCtx.resume();\n    return audioCtx;\n  }\n\n  function playTone(freq, duration, type, delay, volume){\n    if (!soundEnabled) return;\n    const ctx = getAudioCtx();\n    if (!ctx) return;\n    try {\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      osc.type = type || 'sine';\n      osc.frequency.value = freq;\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      const startTime = ctx.currentTime + (delay || 0);\n      const vol = volume == null ? SOUND_VOLUME : volume;\n      gain.gain.setValueAtTime(vol, startTime);\n      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);\n      osc.start(startTime);\n      osc.stop(startTime + duration + 0.03);\n    } catch (e) { /* \u0437\u0432\u0443\u043a \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d \u2014 \u043f\u0440\u043e\u0441\u0442\u043e \u043f\u0440\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u043c */ }\n  }\n\n  function playCorrectSound(){\n    SOUND_STYLE.correct.forEach((f, i) => playTone(f, 0.12 + i * 0.05, SOUND_STYLE.correctType, i * 0.1, SOUND_VOLUME));\n  }\n  function playWrongSound(){\n    playTone(SOUND_STYLE.wrong, 0.28, SOUND_STYLE.wrongType, 0, SOUND_VOLUME * 0.7);\n  }\n  function playCompletionSound(){\n    SOUND_STYLE.completion.forEach((f, i) => playTone(f, 0.28, SOUND_STYLE.completionType, i * 0.13, SOUND_VOLUME));\n  }\n\n  // ---------- \u041a\u043e\u043d\u0444\u0435\u0442\u0442\u0438 ----------\n  const confettiLayer = document.getElementById('confetti-layer');\n  const CONFETTI_COLORS = ['#ff8234', '#a3bf6f', '#ffcf9e', '#ffffff', '#ffd447'];\n\n  function launchConfetti(){\n    for (let i = 0; i < 60; i++){\n      const el = document.createElement('div');\n      el.className = 'confetti-piece';\n      el.style.left = (Math.random() * 100) + '%';\n      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];\n      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';\n      el.style.animationDelay = (Math.random() * 0.4) + 's';\n      el.style.transform = `rotate(${Math.random() * 360}deg)`;\n      confettiLayer.appendChild(el);\n      setTimeout(() => el.remove(), 4200);\n    }\n  }\n\n  function completeTask(){\n    playCorrectSound();\n    setTimeout(() => {\n      overlay.classList.remove('visible');\n      solveCategory(currentTaskCat);\n    }, 500);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0442\u0435\u0441\u0442 \u0441 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430\u043c\u0438 ----\n  function renderQuizTask(task){\n    const wrap = document.createElement('div');\n    wrap.className = 'task-options';\n    (task.options || []).forEach(opt => {\n      const btn = document.createElement('button');\n      btn.className = 'task-opt';\n      const imgHtml = opt.img ? `<img class=\"task-opt-image\" src=\"${opt.img}\" alt=\"\">` : '';\n      btn.innerHTML = `${imgHtml}<span>${opt.text || ''}</span>`;\n      btn.addEventListener('click', () => {\n        if (opt.correct){\n          btn.classList.add('correct');\n          completeTask();\n        } else {\n          btn.classList.add('wrong');\n          playWrongSound();\n          setTimeout(() => btn.classList.remove('wrong'), 600);\n        }\n      });\n      wrap.appendChild(btn);\n    });\n    taskBody.appendChild(wrap);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0432\u0435\u0440\u043d\u043e / \u043d\u0435\u0432\u0435\u0440\u043d\u043e ----\n  function renderTrueFalseTask(task){\n    const wrap = document.createElement('div');\n    wrap.className = 'tf-row';\n    [{label:TRUE_LABEL, val:true}, {label:FALSE_LABEL, val:false}].forEach(opt => {\n      const btn = document.createElement('button');\n      btn.className = 'tf-btn';\n      btn.textContent = opt.label;\n      btn.addEventListener('click', () => {\n        if (opt.val === !!task.answer){\n          btn.classList.add('correct');\n          completeTask();\n        } else {\n          btn.classList.add('wrong');\n          playWrongSound();\n          setTimeout(() => btn.classList.remove('wrong'), 600);\n        }\n      });\n      wrap.appendChild(btn);\n    });\n    taskBody.appendChild(wrap);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0432\u0432\u043e\u0434 \u043e\u0442\u0432\u0435\u0442\u0430 \u0442\u0435\u043a\u0441\u0442\u043e\u043c/\u0447\u0438\u0441\u043b\u043e\u043c ----\n  function renderInputTask(task){\n    const wrap = document.createElement('div');\n    wrap.innerHTML = `\n      <div class=\"input-row\">\n        <input type=\"text\" class=\"input-field\" placeholder=\"\u0412\u0432\u0435\u0434\u0438 \u043e\u0442\u0432\u0435\u0442\">\n        <button class=\"input-check-btn\">\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c</button>\n      </div>\n      <div class=\"input-feedback\"></div>\n    `;\n    const field = wrap.querySelector('.input-field');\n    const feedback = wrap.querySelector('.input-feedback');\n    const check = () => {\n      const given = field.value.trim().toLowerCase();\n      const correct = String(task.answer || '').trim().toLowerCase();\n      if (given.length && given === correct){\n        field.classList.remove('wrong'); field.classList.add('correct');\n        feedback.textContent = '\u0412\u0435\u0440\u043d\u043e!';\n        feedback.className = 'input-feedback correct';\n        completeTask();\n      } else {\n        field.classList.remove('correct'); field.classList.add('wrong');\n        feedback.textContent = '\u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439 \u0435\u0449\u0451 \u0440\u0430\u0437';\n        feedback.className = 'input-feedback wrong';\n        playWrongSound();\n      }\n    };\n    wrap.querySelector('.input-check-btn').addEventListener('click', check);\n    field.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });\n    taskBody.appendChild(wrap);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u043f\u0430\u0440 ----\n  function renderMatchTask(task){\n    const pairs = task.pairs || [];\n    const rightShuffled = pairs.map((p, i) => ({text:p.right, pairIndex:i}));\n    for (let i = rightShuffled.length - 1; i > 0; i--){\n      const j = Math.floor(Math.random() * (i + 1));\n      [rightShuffled[i], rightShuffled[j]] = [rightShuffled[j], rightShuffled[i]];\n    }\n\n    const wrap = document.createElement('div');\n    wrap.className = 'match-columns';\n    const leftCol = document.createElement('div');\n    leftCol.className = 'match-col';\n    const rightCol = document.createElement('div');\n    rightCol.className = 'match-col';\n\n    let selectedLeft = null;\n    let selectedRight = null;\n    let matchedCount = 0;\n\n    pairs.forEach((p, i) => {\n      const pill = document.createElement('button');\n      pill.className = 'match-pill';\n      pill.textContent = p.left;\n      pill.dataset.pairIndex = i;\n      pill.addEventListener('click', () => {\n        if (pill.classList.contains('matched')) return;\n        leftCol.querySelectorAll('.match-pill').forEach(el => el.classList.remove('selected'));\n        pill.classList.add('selected');\n        selectedLeft = pill;\n        tryMatch();\n      });\n      leftCol.appendChild(pill);\n    });\n\n    rightShuffled.forEach(r => {\n      const pill = document.createElement('button');\n      pill.className = 'match-pill';\n      pill.textContent = r.text;\n      pill.dataset.pairIndex = r.pairIndex;\n      pill.addEventListener('click', () => {\n        if (pill.classList.contains('matched')) return;\n        rightCol.querySelectorAll('.match-pill').forEach(el => el.classList.remove('selected'));\n        pill.classList.add('selected');\n        selectedRight = pill;\n        tryMatch();\n      });\n      rightCol.appendChild(pill);\n    });\n\n    function tryMatch(){\n      if (!selectedLeft || !selectedRight) return;\n      if (selectedLeft.dataset.pairIndex === selectedRight.dataset.pairIndex){\n        selectedLeft.classList.add('matched');\n        selectedRight.classList.add('matched');\n        selectedLeft.classList.remove('selected');\n        selectedRight.classList.remove('selected');\n        matchedCount++;\n        selectedLeft = null; selectedRight = null;\n        if (matchedCount === pairs.length) completeTask();\n      } else {\n        selectedLeft.classList.add('wrong-flash');\n        selectedRight.classList.add('wrong-flash');\n        playWrongSound();\n        setTimeout(() => {\n          selectedLeft.classList.remove('selected', 'wrong-flash');\n          selectedRight.classList.remove('selected', 'wrong-flash');\n          selectedLeft = null; selectedRight = null;\n        }, 500);\n      }\n    }\n\n    wrap.appendChild(leftCol);\n    wrap.appendChild(rightCol);\n    taskBody.appendChild(wrap);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0440\u0430\u0441\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043f\u043e \u043f\u043e\u0440\u044f\u0434\u043a\u0443 ----\n  function renderOrderTask(task){\n    let current = (task.items || []).slice();\n    for (let i = current.length - 1; i > 0; i--){\n      const j = Math.floor(Math.random() * (i + 1));\n      [current[i], current[j]] = [current[j], current[i]];\n    }\n\n    const wrap = document.createElement('div');\n    const list = document.createElement('div');\n    list.className = 'order-list';\n    const feedback = document.createElement('div');\n    feedback.className = 'order-feedback';\n\n    function render(){\n      list.innerHTML = '';\n      current.forEach((text, i) => {\n        const row = document.createElement('div');\n        row.className = 'order-item';\n        row.innerHTML = `\n          <button class=\"order-move-btn\" data-dir=\"up\" ${i === 0 ? 'disabled' : ''}>\u2191</button>\n          <button class=\"order-move-btn\" data-dir=\"down\" ${i === current.length - 1 ? 'disabled' : ''}>\u2193</button>\n          <div class=\"order-text\">${text}</div>\n        `;\n        row.querySelector('[data-dir=\"up\"]').addEventListener('click', () => {\n          [current[i-1], current[i]] = [current[i], current[i-1]];\n          render();\n        });\n        row.querySelector('[data-dir=\"down\"]').addEventListener('click', () => {\n          [current[i], current[i+1]] = [current[i+1], current[i]];\n          render();\n        });\n        list.appendChild(row);\n      });\n    }\n    render();\n\n    const checkBtn = document.createElement('button');\n    checkBtn.className = 'order-check-btn';\n    checkBtn.textContent = '\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u043f\u043e\u0440\u044f\u0434\u043e\u043a';\n    checkBtn.addEventListener('click', () => {\n      const correct = (task.items || []).every((t, i) => t === current[i]);\n      if (correct){\n        feedback.textContent = '\u0412\u0435\u0440\u043d\u043e!';\n        feedback.className = 'order-feedback correct';\n        completeTask();\n      } else {\n        feedback.textContent = '\u041f\u043e\u043a\u0430 \u043d\u0435 \u0442\u0430\u043a, \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439 \u0435\u0449\u0451 \u0440\u0430\u0437';\n        feedback.className = 'order-feedback wrong';\n        playWrongSound();\n      }\n    });\n\n    wrap.appendChild(list);\n    wrap.appendChild(checkBtn);\n    wrap.appendChild(feedback);\n    taskBody.appendChild(wrap);\n  }\n\n  // ---- \u0422\u0438\u043f: \u0441\u043e\u0431\u0435\u0440\u0438 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0435 ----\n  function renderSentenceTask(task){\n    const words = task.words || [];\n    const shuffled = words.map((w, i) => ({text: w, idx: i}));\n    for (let i = shuffled.length - 1; i > 0; i--){\n      const j = Math.floor(Math.random() * (i + 1));\n      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];\n    }\n\n    const wrap = document.createElement('div');\n    const assembledRow = document.createElement('div');\n    assembledRow.className = 'sentence-assembled';\n    const chipsRow = document.createElement('div');\n    chipsRow.className = 'sentence-chips';\n\n    let nextIndex = 0;\n\n    function renderAssembled(){\n      if (nextIndex === 0){\n        assembledRow.innerHTML = '<span class=\"sentence-placeholder\">\u2026</span>';\n      } else {\n        assembledRow.innerHTML = words.slice(0, nextIndex)\n          .map(w => `<span class=\"sentence-word\">${w}</span>`).join(' ');\n      }\n    }\n    renderAssembled();\n\n    shuffled.forEach(item => {\n      const chip = document.createElement('button');\n      chip.className = 'sentence-chip';\n      chip.textContent = item.text;\n      chip.addEventListener('click', () => {\n        if (chip.disabled) return;\n        if (item.idx === nextIndex){\n          chip.disabled = true;\n          chip.classList.add('used');\n          nextIndex++;\n          renderAssembled();\n          if (nextIndex === words.length) completeTask();\n        } else {\n          playWrongSound();\n          chip.classList.add('shake');\n          setTimeout(() => chip.classList.remove('shake'), 400);\n        }\n      });\n      chipsRow.appendChild(chip);\n    });\n\n    wrap.appendChild(assembledRow);\n    wrap.appendChild(chipsRow);\n    taskBody.appendChild(wrap);\n  }\n\n  taskClose.addEventListener('click', () => overlay.classList.remove('visible'));\n\n  function solveCategory(cat){\n    cat.solved = true;\n    const slot = document.querySelector(`.lock-slot[data-cat-id=\"${cat.id}\"]`);\n    slot.classList.remove('active');\n    slot.classList.add('solved');\n    slot.querySelector('.lock-icon').textContent = '\ud83d\udd13';\n\n    showCategoryTray(cat);\n    updateProgress();\n  }\n\n  function showCategoryTray(cat){\n    // \u041f\u043e\u0434\u0441\u0432\u0435\u0442\u043a\u0430 \u0432\u044b\u0431\u0440\u0430\u043d\u043d\u043e\u0439 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0432 \u0441\u043f\u0438\u0441\u043a\u0435\n    document.querySelectorAll('.lock-slot').forEach(s => s.classList.remove('viewing'));\n    const slot = document.querySelector(`.lock-slot[data-cat-id=\"${cat.id}\"]`);\n    if (slot) slot.classList.add('viewing');\n\n    // \u041b\u043e\u0442\u043e\u043a \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u044b \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u043d\u043e\u0439 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0437\u0430 \u0440\u0430\u0437\n    tray.innerHTML = '';\n\n    const group = document.createElement('div');\n    group.className = 'tray-group';\n    group.dataset.catId = cat.id;\n    group.innerHTML = `\n      <div class=\"tray-group-label\">${cat.label}</div>\n      <div class=\"tray-group-items\"></div>\n    `;\n    tray.appendChild(group);\n    const groupItems = group.querySelector('.tray-group-items');\n\n    cat.items.forEach(item => {\n      const el = document.createElement('div');\n      el.className = 'tray-item';\n      if (item.img){\n        el.innerHTML = `<img src=\"${item.img}\" alt=\"\">`;\n      } else {\n        el.textContent = item.glyph;\n      }\n      el.draggable = true;\n      el.addEventListener('dragstart', (e) => {\n        e.dataTransfer.setData('text/plain', JSON.stringify({\n          glyph: item.glyph || null,\n          img: item.img || null,\n          baseSize: item.baseSize || null,\n          catId: cat.id\n        }));\n        el.classList.add('dragging');\n      });\n      el.addEventListener('dragend', () => el.classList.remove('dragging'));\n      groupItems.appendChild(el);\n    });\n\n    updateProgress();\n  }\n\n  // ---------- Drag & drop \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u043e\u0432 \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0443 ----------\n  room.addEventListener('dragover', (e) => e.preventDefault());\n  room.addEventListener('drop', (e) => {\n    e.preventDefault();\n    const raw = e.dataTransfer.getData('text/plain');\n    if (!raw) return;\n    let data;\n    try { data = JSON.parse(raw); } catch (err) { data = { glyph: raw }; }\n    const rect = room.getBoundingClientRect();\n    const x = e.clientX - rect.left;\n    const y = e.clientY - rect.top;\n    placeItem(data, x, y);\n  });\n\n  function placeItem(data, x, y){\n    const baseSize = data.baseSize || 64;\n    const el = document.createElement('div');\n    el.className = 'placed-item';\n    el.style.width = baseSize + 'px';\n    el.style.height = baseSize + 'px';\n    el.style.left = (x - baseSize / 2) + 'px';\n    el.style.top = (y - baseSize / 2) + 'px';\n    el.dataset.cx = x;\n    el.dataset.cy = y;\n    el.dataset.scale = 1;\n    el.dataset.rot = 0;\n    el.dataset.flipx = 1;\n    el.dataset.flipy = 1;\n    el.dataset.base = baseSize;\n\n    const visualInner = data.img\n      ? `<img src=\"${data.img}\" alt=\"\">`\n      : `<div class=\"glyph\">${data.glyph}</div>`;\n\n    el.innerHTML = `\n      <button class=\"item-delete\" title=\"\u0423\u0431\u0440\u0430\u0442\u044c\">\u00d7</button>\n      <button class=\"item-flip item-flip-h\" title=\"\u041e\u0442\u0440\u0430\u0437\u0438\u0442\u044c \u043f\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u0438\">\u21cb</button>\n      <button class=\"item-flip item-flip-v\" title=\"\u041e\u0442\u0440\u0430\u0437\u0438\u0442\u044c \u043f\u043e \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u0438\">\u21f5</button>\n      <div class=\"item-visual\">\n        ${visualInner}\n        <div class=\"item-handle\" title=\"\u0422\u044f\u043d\u0438: \u0443\u0432\u0435\u043b\u0438\u0447\u0438\u0442\u044c \u0438 \u043f\u043e\u0432\u0435\u0440\u043d\u0443\u0442\u044c\"></div>\n      </div>\n    `;\n    room.appendChild(el);\n    setupItemInteractions(el);\n    selectItem(el);\n\n    // \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u0434\u0430\u0451\u0442 \u0431\u0430\u043b\u043b \u0437\u0430 \u0440\u0430\u0437\u043c\u0435\u0449\u0435\u043d\u0438\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u2014\n    // \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u0435 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u044b \u0438\u0437 \u0442\u043e\u0439 \u0436\u0435 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0443\u0436\u0435 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u044e\u0442\n    if (data.catId){\n      const cat = categories.find(c => c.id === data.catId);\n      if (cat && !cat.placed){\n        cat.placed = true;\n      }\n    }\n    updateProgress();\n  }\n\n  function applyTransform(el){\n    const visual = el.querySelector('.item-visual');\n    const scale = el.dataset.scale;\n    const flipX = el.dataset.flipx;\n    const flipY = el.dataset.flipy;\n    visual.style.transform = `rotate(${el.dataset.rot}deg) scale(${scale * flipX}, ${scale * flipY})`;\n  }\n\n  function setupItemInteractions(el){\n    const visual = el.querySelector('.item-visual');\n    const handle = el.querySelector('.item-handle');\n    const delBtn = el.querySelector('.item-delete');\n    const flipHBtn = el.querySelector('.item-flip-h');\n    const flipVBtn = el.querySelector('.item-flip-v');\n\n    flipHBtn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      el.dataset.flipx = parseFloat(el.dataset.flipx) * -1;\n      applyTransform(el);\n    });\n    flipVBtn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      el.dataset.flipy = parseFloat(el.dataset.flipy) * -1;\n      applyTransform(el);\n    });\n\n    // ---- \u041f\u0435\u0440\u0435\u043c\u0435\u0449\u0435\u043d\u0438\u0435 (\u0442\u044f\u043d\u0435\u043c \u0442\u0435\u043b\u043e \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0430) ----\n    let moving = false, startPX = 0, startPY = 0, startCX = 0, startCY = 0;\n\n    visual.addEventListener('pointerdown', (e) => {\n      e.stopPropagation();\n      selectItem(el);\n      moving = true;\n      visual.setPointerCapture(e.pointerId);\n      startPX = e.clientX; startPY = e.clientY;\n      startCX = parseFloat(el.dataset.cx);\n      startCY = parseFloat(el.dataset.cy);\n    });\n    visual.addEventListener('pointermove', (e) => {\n      if (!moving) return;\n      const dx = e.clientX - startPX;\n      const dy = e.clientY - startPY;\n      const nx = startCX + dx, ny = startCY + dy;\n      el.dataset.cx = nx; el.dataset.cy = ny;\n      const base = parseFloat(el.dataset.base);\n      el.style.left = (nx - base / 2) + 'px';\n      el.style.top = (ny - base / 2) + 'px';\n    });\n    visual.addEventListener('pointerup', () => moving = false);\n    visual.addEventListener('pointercancel', () => moving = false);\n\n    // ---- \u042f\u043a\u043e\u0440\u044c: \u0442\u044f\u043d\u0435\u043c \u2014 \u0440\u0430\u0441\u0442\u0451\u0442 \u0438 \u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 \u0446\u0435\u043d\u0442\u0440\u0430 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0430 ----\n    let handling = false;\n    handle.addEventListener('pointerdown', (e) => {\n      e.stopPropagation();\n      selectItem(el);\n      handling = true;\n      handle.setPointerCapture(e.pointerId);\n    });\n    handle.addEventListener('pointermove', (e) => {\n      if (!handling) return;\n      const roomRect = room.getBoundingClientRect();\n      const cx = parseFloat(el.dataset.cx);\n      const cy = parseFloat(el.dataset.cy);\n      const px = e.clientX - roomRect.left;\n      const py = e.clientY - roomRect.top;\n      const dx = px - cx, dy = py - cy;\n\n      const angle = Math.atan2(dy, dx) * 180 / Math.PI;\n      const rot = angle - 45; // \u044f\u043a\u043e\u0440\u044c \u0441\u0442\u043e\u0438\u0442 \u0432 \u0443\u0433\u043b\u0443 \u043f\u043e\u0434 45\u00b0, \u044d\u0442\u043e \u043d\u0443\u043b\u0435\u0432\u0430\u044f \u0442\u043e\u0447\u043a\u0430 \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430\n\n      const dist = Math.sqrt(dx * dx + dy * dy);\n      const base = parseFloat(el.dataset.base);\n      const baseDist = (base / 2) * Math.SQRT2;\n      let scale = dist / baseDist;\n      scale = Math.max(0.35, Math.min(4, scale));\n\n      el.dataset.rot = rot;\n      el.dataset.scale = scale;\n      applyTransform(el);\n    });\n    handle.addEventListener('pointerup', () => handling = false);\n    handle.addEventListener('pointercancel', () => handling = false);\n\n    // ---- \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 ----\n    delBtn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      el.remove();\n      if (selectedItem === el) selectedItem = null;\n      updateProgress();\n    });\n  }\n\n  function selectItem(el){\n    if (selectedItem) selectedItem.classList.remove('selected');\n    selectedItem = el;\n    el.classList.add('selected');\n    zCounter++;\n    el.style.zIndex = zCounter;\n  }\n\n  room.addEventListener('pointerdown', (e) => {\n    if (e.target === room || e.target.classList.contains('wall-seg')){\n      if (selectedItem){\n        selectedItem.classList.remove('selected');\n        selectedItem = null;\n      }\n    }\n  });\n\n  // ---------- \u041f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 ----------\n  // ---------- \u042d\u043a\u0440\u0430\u043d \u043f\u043e\u0437\u0434\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u043f\u0440\u0438 100% ----------\n  const TRUE_LABEL = '__TEXT_TRUE_LABEL__';\n  const FALSE_LABEL = '__TEXT_FALSE_LABEL__';\n  const COMPLETION_ENABLED = __COMPLETION_ENABLED__;\n  const completionScreen = document.getElementById('completion-screen');\n  const completionImage = document.getElementById('completion-image');\n  const completionClose = document.getElementById('completion-close');\n  let completionShown = false;\n\n  if (!completionImage.getAttribute('src')){\n    completionImage.style.display = 'none';\n  }\n\n  completionClose.addEventListener('click', () => {\n    completionScreen.classList.remove('visible');\n  });\n\n  function updateProgress(){\n    const done = categories.reduce((sum, c) => {\n      return sum + (c.solved ? 1 : 0) + (c.placed ? 1 : 0);\n    }, 0);\n    const pct = Math.min(100, Math.round((done / totalSteps) * 100));\n    progressFill.style.width = pct + '%';\n    progressPct.textContent = pct + '%';\n\n    if (pct === 100 && !completionShown && COMPLETION_ENABLED){\n      completionShown = true;\n      setTimeout(() => {\n        completionScreen.classList.add('visible');\n        launchConfetti();\n        playCompletionSound();\n      }, 400);\n    }\n  }\n\n})();\n<\/script>\n</body>\n</html>\n";

  function hexToRgba(hex, alpha){
    hex = String(hex || '#000000').replace('#', '');
    if (hex.length === 3){
      hex = hex.split('').map(c => c + c).join('');
    }
    const r = parseInt(hex.substring(0, 2), 16) || 0;
    const g = parseInt(hex.substring(2, 4), 16) || 0;
    const b = parseInt(hex.substring(4, 6), 16) || 0;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  let editorAudioCtx = null;

  function editorPlayTone(freq, duration, type, delay, volume){
    if (!editorAudioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      editorAudioCtx = new AC();
    }
    if (editorAudioCtx.state === 'suspended') editorAudioCtx.resume();
    try {
      const osc = editorAudioCtx.createOscillator();
      const gain = editorAudioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(editorAudioCtx.destination);
      const startTime = editorAudioCtx.currentTime + delay;
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.03);
    } catch (e) {}
  }

  function testPlaySound(kind){
    const s = EDITOR_SOUND_STYLES[state.sound.style] || EDITOR_SOUND_STYLES.soft;
    const vol = state.sound.volume;
    if (kind === 'correct'){
      s.correct.forEach((f, i) => editorPlayTone(f, 0.12 + i*0.05, s.correctType, i*0.1, vol));
    } else if (kind === 'wrong'){
      editorPlayTone(s.wrong, 0.28, s.wrongType, 0, vol*0.7);
    } else if (kind === 'completion'){
      s.completion.forEach((f, i) => editorPlayTone(f, 0.28, s.completionType, i*0.13, vol));
    }
  }

      schedulePreview();

    const locationsList = wrap.querySelector('#locations-list');

      locationsList.innerHTML = '';

  // ---------- Вкладка: Задания (категории) ----------
  function ensureTaskDefaults(cat){
    const type = cat.task.type || 'quiz';
    cat.task.type = type;
    if (type === 'quiz'){
      if (!cat.task.options) cat.task.options = [];
      while (cat.task.options.length < 3){
        cat.task.options.push({text:'', correct: cat.task.options.length === 0});
      }
    } else if (type === 'truefalse'){
      if (typeof cat.task.answer !== 'boolean') cat.task.answer = true;
    } else if (type === 'input'){
      if (typeof cat.task.answer !== 'string') cat.task.answer = '';
    } else if (type === 'match'){
      if (!cat.task.pairs || !cat.task.pairs.length){
        cat.task.pairs = [{left:'', right:''}, {left:'', right:''}, {left:'', right:''}];
      }
    } else if (type === 'order'){
      if (!cat.task.items || !cat.task.items.length){
        cat.task.items = ['', '', ''];
      }
    } else if (type === 'sentence'){
      if (!cat.task.words || !cat.task.words.length){
        cat.task.words = ['', '', ''];
      }
    }
  }

  const TASK_TYPE_LABELS = {
    quiz: 'Тест с вариантами',
    truefalse: 'Верно / неверно',
    input: 'Ввод ответа',
    match: 'Соединение пар',
    order: 'Расставить по порядку',
    sentence: 'Собери предложение'
  };

  function buildTaskSection(cat, taskDiv){
    ensureTaskDefaults(cat);
    const type = cat.task.type;

    taskDiv.innerHTML = `
      <span class="field-label">Тип задания</span>
      <select class="cat-type-select">
        ${Object.keys(TASK_TYPE_LABELS).map(t => `<option value="${t}" ${t===type?'selected':''}>${TASK_TYPE_LABELS[t]}</option>`).join('')}
      </select>
      <span class="field-label" style="margin-top:12px;">Вопрос / инструкция</span>
      <input type="text" class="cat-question" value="${escapeAttr(cat.task.question||'')}" placeholder="Например: Сколько будет 6 × 4?">
      <div class="option-hint">Можно вставлять формулы: $x^2+y^2=c^2$ — знаки $...$ обязательны</div>

      <span class="field-label" style="margin-top:10px;">Картинка к вопросу (необязательно)</span>
      <div class="qimg-row">
        <div class="item-thumb" id="question-image-thumb" style="background-image:url('${cat.task.questionImage || ''}')"></div>
        <input type="text" class="cat-question-image" value="${escapeAttr(cat.task.questionImage || '')}" placeholder="Ссылка на картинку или загрузи с компьютера">
        <button class="upload-btn" id="question-image-upload" title="Загрузить с компьютера">📁</button>
      </div>

      <div class="cat-type-fields"></div>
    `;

    taskDiv.querySelector('.cat-type-select').addEventListener('change', (e) => {
      cat.task.type = e.target.value;
      buildTaskSection(cat, taskDiv);
      schedulePreview();
    });
    taskDiv.querySelector('.cat-question').addEventListener('input', (e) => {
      cat.task.question = e.target.value;
      schedulePreview();
    });

    const qImgInput = taskDiv.querySelector('.cat-question-image');
    const qImgThumb = taskDiv.querySelector('#question-image-thumb');
    qImgInput.addEventListener('input', () => {
      cat.task.questionImage = qImgInput.value;
      qImgThumb.style.backgroundImage = `url('${qImgInput.value}')`;
      schedulePreview();
    });
    taskDiv.querySelector('#question-image-upload').addEventListener('click', () => {
      pickImageFile((dataUrl) => {
        cat.task.questionImage = dataUrl;
        qImgInput.value = dataUrl;
        qImgThumb.style.backgroundImage = `url('${dataUrl}')`;
        schedulePreview();
      });
    });

    const fieldsWrap = taskDiv.querySelector('.cat-type-fields');
    if (type === 'quiz') buildQuizFields(cat, fieldsWrap);
    else if (type === 'truefalse') buildTrueFalseFields(cat, fieldsWrap);
    else if (type === 'input') buildInputFields(cat, fieldsWrap);
    else if (type === 'match') buildMatchFields(cat, fieldsWrap);
    else if (type === 'order') buildOrderFields(cat, fieldsWrap);
    else if (type === 'sentence') buildSentenceFields(cat, fieldsWrap);
  }

  function buildQuizFields(cat, wrap){
    const optionsHtml = cat.task.options.map((opt, i) => `
      <div class="option-row" style="flex-wrap:wrap;">
        <input type="radio" name="${cat.id}-correct" ${opt.correct ? 'checked' : ''} data-opt-index="${i}">
        <input type="text" value="${escapeAttr(opt.text)}" placeholder="Вариант ответа" data-opt-text-index="${i}" style="flex:1;">
        <div class="item-thumb opt-img-thumb" data-opt-thumb-index="${i}" style="background-image:url('${opt.img || ''}')"></div>
        <input type="text" class="opt-img-input" value="${escapeAttr(opt.img || '')}" placeholder="Картинка варианта (необязательно)" data-opt-img-index="${i}" style="flex:1 1 100%; margin-top:4px;">
        <button class="upload-btn opt-img-upload" data-opt-upload-index="${i}" title="Загрузить с компьютера">📁</button>
      </div>
    `).join('');
    wrap.innerHTML = `
      <span class="field-label">Варианты ответа (отметь точкой правильный)</span>
      <div class="cat-options">${optionsHtml}</div>
      <div class="option-hint">Кружком слева отмечается правильный вариант. Картинка у варианта — по желанию.</div>
    `;
    wrap.querySelectorAll('.option-row input[type="radio"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        const idx = parseInt(radio.dataset.optIndex, 10);
        cat.task.options.forEach((o, i) => o.correct = (i === idx));
        schedulePreview();
      });
    });
    wrap.querySelectorAll('.option-row input[type="text"]:not(.opt-img-input)').forEach((inp) => {
      inp.addEventListener('input', () => {
        const idx = parseInt(inp.dataset.optTextIndex, 10);
        cat.task.options[idx].text = inp.value;
        schedulePreview();
      });
    });
    wrap.querySelectorAll('.opt-img-input').forEach((inp) => {
      inp.addEventListener('input', () => {
        const idx = parseInt(inp.dataset.optImgIndex, 10);
        cat.task.options[idx].img = inp.value;
        const thumb = wrap.querySelector(`.opt-img-thumb[data-opt-thumb-index="${idx}"]`);
        if (thumb) thumb.style.backgroundImage = `url('${inp.value}')`;
        schedulePreview();
      });
    });
    wrap.querySelectorAll('.opt-img-upload').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.optUploadIndex, 10);
        pickImageFile((dataUrl) => {
          cat.task.options[idx].img = dataUrl;
          const input = wrap.querySelector(`.opt-img-input[data-opt-img-index="${idx}"]`);
          const thumb = wrap.querySelector(`.opt-img-thumb[data-opt-thumb-index="${idx}"]`);
          if (input) input.value = dataUrl;
          if (thumb) thumb.style.backgroundImage = `url('${dataUrl}')`;
          schedulePreview();
        });
      });
    });
  }

  function buildTrueFalseFields(cat, wrap){
    wrap.innerHTML = `
      <span class="field-label">Правильный ответ</span>
      <div class="option-row">
        <input type="radio" name="${cat.id}-tf" ${cat.task.answer === true ? 'checked' : ''} data-tf="true">
        <span style="flex:1; color:rgba(250,230,216,0.85);">${escapeHtml(state.text.trueLabel)}</span>
      </div>
      <div class="option-row">
        <input type="radio" name="${cat.id}-tf" ${cat.task.answer === false ? 'checked' : ''} data-tf="false">
        <span style="flex:1; color:rgba(250,230,216,0.85);">${escapeHtml(state.text.falseLabel)}</span>
      </div>
      <div class="option-hint">Сам текст «${escapeHtml(state.text.trueLabel)}» / «${escapeHtml(state.text.falseLabel)}» меняется на вкладке «Редактор текста» — общий для всех заданий этого типа</div>
    `;
    wrap.querySelectorAll('input[type="radio"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        cat.task.answer = radio.dataset.tf === 'true';
        schedulePreview();
      });
    });
  }

  function buildInputFields(cat, wrap){
    wrap.innerHTML = `
      <span class="field-label">Правильный ответ (текст или число)</span>
      <input type="text" class="cat-input-answer" value="${escapeAttr(cat.task.answer || '')}" placeholder="Например: 24">
      <div class="option-hint">Ответ проверяется без учёта регистра и лишних пробелов</div>
    `;
    wrap.querySelector('.cat-input-answer').addEventListener('input', (e) => {
      cat.task.answer = e.target.value;
      schedulePreview();
    });
  }

  function buildMatchFields(cat, wrap){
    function renderPairs(){
      const rowsHtml = cat.task.pairs.map((p, i) => `
        <div class="pair-row" data-pair-index="${i}">
          <input type="text" value="${escapeAttr(p.left)}" placeholder="Слева" class="pair-left">
          <input type="text" value="${escapeAttr(p.right)}" placeholder="Справа" class="pair-right">
          <button class="remove-btn" title="Удалить пару">×</button>
        </div>
      `).join('');
      wrap.innerHTML = `
        <span class="field-label">Пары для соединения</span>
        <div class="pairs-list">${rowsHtml}</div>
        <button class="add-item-btn add-pair-btn">+ Добавить пару</button>
      `;
      wrap.querySelectorAll('.pair-row').forEach((row) => {
        const idx = parseInt(row.dataset.pairIndex, 10);
        row.querySelector('.pair-left').addEventListener('input', (e) => {
          cat.task.pairs[idx].left = e.target.value; schedulePreview();
        });
        row.querySelector('.pair-right').addEventListener('input', (e) => {
          cat.task.pairs[idx].right = e.target.value; schedulePreview();
        });
        row.querySelector('.remove-btn').addEventListener('click', () => {
          cat.task.pairs.splice(idx, 1);
          renderPairs(); schedulePreview();
        });
      });
      wrap.querySelector('.add-pair-btn').addEventListener('click', () => {
        cat.task.pairs.push({left:'', right:''});
        renderPairs(); schedulePreview();
      });
    }
    renderPairs();
  }

  function buildOrderFields(cat, wrap){
    function renderItems(){
      const rowsHtml = cat.task.items.map((val, i) => `
        <div class="order-edit-row" data-item-index="${i}">
          <input type="text" value="${escapeAttr(val)}" placeholder="Шаг ${i+1}" class="order-edit-input">
          <button class="remove-btn" title="Удалить">×</button>
        </div>
      `).join('');
      wrap.innerHTML = `
        <span class="field-label">Правильный порядок (сверху вниз)</span>
        <div class="order-edit-list">${rowsHtml}</div>
        <button class="add-item-btn add-order-btn">+ Добавить шаг</button>
        <div class="option-hint">При показе ученику пункты перемешиваются случайно</div>
      `;
      wrap.querySelectorAll('.order-edit-row').forEach((row) => {
        const idx = parseInt(row.dataset.itemIndex, 10);
        row.querySelector('.order-edit-input').addEventListener('input', (e) => {
          cat.task.items[idx] = e.target.value; schedulePreview();
        });
        row.querySelector('.remove-btn').addEventListener('click', () => {
          cat.task.items.splice(idx, 1);
          renderItems(); schedulePreview();
        });
      });
      wrap.querySelector('.add-order-btn').addEventListener('click', () => {
        cat.task.items.push('');
        renderItems(); schedulePreview();
      });
    }
    renderItems();
  }

  function buildSentenceFields(cat, wrap){
    function renderWords(){
      const rowsHtml = cat.task.words.map((val, i) => `
        <div class="word-row" data-word-index="${i}">
          <input type="text" value="${escapeAttr(val)}" placeholder="Слово ${i+1}" class="sentence-edit-input">
          <button class="remove-btn" title="Удалить">×</button>
        </div>
      `).join('');
      wrap.innerHTML = `
        <span class="field-label">Слова в правильном порядке предложения</span>
        <div class="sentence-edit-list">${rowsHtml}</div>
        <button class="add-item-btn add-word-btn">+ Добавить слово</button>
        <div class="option-hint">При показе ученику слова перемешиваются, он собирает их по порядку кликом</div>
      `;
      wrap.querySelectorAll('.word-row').forEach((row) => {
        const idx = parseInt(row.dataset.wordIndex, 10);
        row.querySelector('.sentence-edit-input').addEventListener('input', (e) => {
          cat.task.words[idx] = e.target.value; schedulePreview();
        });
        row.querySelector('.remove-btn').addEventListener('click', () => {
          cat.task.words.splice(idx, 1);
          renderWords(); schedulePreview();
        });
      });
      wrap.querySelector('.add-word-btn').addEventListener('click', () => {
        cat.task.words.push('');
        renderWords(); schedulePreview();
      });
    }
    renderWords();

  function renderTasksTab(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="section-title">
        <h2>Задания</h2>
        <button class="add-btn" id="add-category-btn">+ Добавить категорию</button>
      </div>
      <div class="section-hint">Каждая категория — замок в комнате: вопрос открывает предметы для расстановки.</div>

      <button class="add-btn" id="formulas-toggle-btn" type="button" style="margin-bottom:14px;">📐 Шпаргалка формул</button>
      <div id="formulas-panel" style="display:none; margin-bottom:20px;"></div>

      <div id="categories-list"></div>
    `;
    tabContent.appendChild(wrap);

    const formulasToggleBtn = wrap.querySelector('#formulas-toggle-btn');
    const formulasPanel = wrap.querySelector('#formulas-panel');
    let formulasBuilt = false;
    formulasToggleBtn.addEventListener('click', () => {
      const isOpen = formulasPanel.style.display !== 'none';
      if (isOpen){
        formulasPanel.style.display = 'none';
        formulasToggleBtn.textContent = '📐 Шпаргалка формул';
      } else {
        if (!formulasBuilt){
          buildFormulasCheatsheet(formulasPanel);
          formulasBuilt = true;
        }
        formulasPanel.style.display = 'block';
        formulasToggleBtn.textContent = '📐 Скрыть шпаргалку формул';
      }
    });

    const categoriesList = wrap.querySelector('#categories-list');

    function renderList(){
      categoriesList.innerHTML = '';
      state.categories.forEach((cat) => {
        ensureTaskDefaults(cat);
        const defaultBaseSize = (cat.items[0] && cat.items[0].baseSize) || 100;

        const itemsHtml = cat.items.map((item) => `
          <div class="item-row" data-item-id="${item.id}">
            <div class="item-thumb" style="background-image:url('${item.img || ''}')"></div>
            <input type="text" value="${escapeAttr(item.img || '')}" placeholder="Ссылка на картинку предмета">
            <button class="upload-btn" title="Загрузить с компьютера">📁</button>
            <button class="remove-btn" title="Удалить предмет">×</button>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerHTML = `
          <div class="cat-top">
            <input type="text" class="cat-label" value="${escapeAttr(cat.label)}" placeholder="Название категории">
            <label class="cat-active-toggle">
              <input type="checkbox" class="cat-active-cb" ${cat.active ? 'checked' : ''}> Активна
            </label>
            <label class="cat-basesize">
              Размер предметов
              <input type="number" class="cat-basesize-input" value="${defaultBaseSize}" min="30" max="400">
            </label>
            <button class="cat-remove">Удалить категорию</button>
          </div>
          <div class="cat-body">
            <div class="cat-task"></div>
            <div class="cat-items">
              <span class="field-label">Предметы категории</span>
              <div class="cat-items-list">${itemsHtml}</div>
              <button class="add-item-btn">+ Добавить предмет</button>
            </div>
          </div>
        `;

        buildTaskSection(cat, card.querySelector('.cat-task'));

        card.querySelector('.cat-label').addEventListener('input', (e) => {
          cat.label = e.target.value;
          cat.task.title = e.target.value;
          schedulePreview();
        });
        card.querySelector('.cat-active-cb').addEventListener('change', (e) => {
          cat.active = e.target.checked;
          schedulePreview();
        });
        card.querySelector('.cat-basesize-input').addEventListener('input', (e) => {
          const val = parseInt(e.target.value, 10) || 100;
          cat.items.forEach(it => it.baseSize = val);
          schedulePreview();
        });
        card.querySelector('.cat-remove').addEventListener('click', () => {
          state.categories = state.categories.filter(c => c !== cat);
          renderList();
          schedulePreview();
        });
        card.querySelectorAll('.item-row').forEach((row) => {
          const itemId = row.dataset.itemId;
          const item = cat.items.find(it => it.id === itemId);
          const input = row.querySelector('input[type="text"]');
          const thumb = row.querySelector('.item-thumb');
          input.addEventListener('input', () => {
            item.img = input.value;
            thumb.style.backgroundImage = `url('${input.value}')`;
            schedulePreview();
          });
          row.querySelector('.upload-btn').addEventListener('click', () => {
            pickImageFile((dataUrl) => {
              item.img = dataUrl;
              input.value = dataUrl;
              thumb.style.backgroundImage = `url('${dataUrl}')`;
              schedulePreview();
            });
          });
          row.querySelector('.remove-btn').addEventListener('click', () => {
            cat.items = cat.items.filter(it => it !== item);
            renderList();
            schedulePreview();
          });
        });
        card.querySelector('.add-item-btn').addEventListener('click', () => {
          cat.items.push({id: uid('item'), img: '', baseSize: defaultBaseSize});
          renderList();
          schedulePreview();
        });

        categoriesList.appendChild(card);
      });
    }
    renderList();

    wrap.querySelector('#add-category-btn').addEventListener('click', () => {
      const id = uid('cat');
